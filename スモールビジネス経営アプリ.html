<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スモールビジネス経営アプリ</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("theme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<script>
  (() => {
    try {
      if (new URLSearchParams(window.location.search).get("theme")) return;
      const saved = localStorage.getItem("learn-ui:theme");
      if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) { /* storage unavailable */ }
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, "BIZ UDPGothic", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 1rem;
  line-height: 1.75;
}
button, input, select { font: inherit; color: inherit; }
.mono, .num { font-variant-numeric: tabular-nums; }
header.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; min-height: 60px;
  background: var(--cp-panel-strong);
  border-bottom: 1px solid var(--cp-border);
}
.brand { font-weight: 700; font-size: 1.125rem; line-height: 1.3; }
.brand small { display: block; font-weight: 400; font-size: 0.8125rem; color: var(--cp-text-muted); }
.logo {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  background: var(--cp-accent); color: var(--cp-accent-fg); font-weight: 800; font-size: 1rem;
}
.prog { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 260px; }
.prog .bar { flex: 1; }
.bar { height: 8px; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--cp-accent); transition: width .4s; }
.prog span { font-size: 0.8125rem; color: var(--cp-text-muted); white-space: nowrap; }
.iconbtn {
  border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: .625rem;
  padding: 6px 10px; cursor: pointer; font-size: 0.875rem; color: var(--cp-text);
}
.iconbtn:hover { border-color: var(--cp-accent); color: var(--cp-accent); }
.layout { display: grid; grid-template-columns: 264px minmax(0, 1fr); }
nav.side {
  position: sticky; top: 60px; height: calc(100vh - 60px); overflow: auto;
  padding: 14px 10px 40px; border-right: 1px solid var(--cp-border); background: var(--cp-bg-elevated);
}
nav.side .grp { font-size: 0.75rem; color: var(--cp-text-soft); margin: 14px 10px 4px; letter-spacing: .08em; }
nav.side button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 0; background: transparent; padding: 7px 10px; border-radius: .625rem; cursor: pointer; font-size: 0.90625rem; line-height: 1.4;
}
nav.side button:hover { background: var(--cp-accent-soft); }
nav.side button.active { background: var(--cp-highlight); color: var(--cp-accent); font-weight: 700; }
nav.side .tag {
  flex: 0 0 auto; min-width: 46px; text-align: center; font-size: 0.71875rem; font-weight: 700;
  border: 1px solid var(--cp-border); border-radius: 6px; padding: 1px 4px; color: var(--cp-text-muted); background: var(--cp-surface);
}
nav.side button.active .tag { border-color: var(--cp-accent); color: var(--cp-accent); }
nav.side .ck { margin-left: auto; color: var(--cp-success); font-weight: 700; }
main { padding: 26px 34px 90px; max-width: 1160px; width: 100%; }
h1 { font-size: 1.875rem; line-height: 1.35; margin: 4px 0 6px; }
h2 { font-size: 1.3125rem; margin: 0 0 10px; line-height: 1.4; }
h3 { font-size: 1.09375rem; margin: 14px 0 6px; }
p { margin: 6px 0; }
.kicker { color: var(--cp-accent); font-weight: 700; font-size: 0.84375rem; letter-spacing: .06em; }
.lead { color: var(--cp-text-muted); font-size: 1.0625rem; }
.card {
  background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px;
  padding: 18px 22px; margin: 16px 0;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
}
.goal { background: var(--cp-accent-soft); border: 1px solid var(--cp-highlight); border-radius: 16px; padding: 12px 18px; margin: 12px 0; }
.goal b { color: var(--cp-accent); }
.analogy { border-left: 4px solid var(--cp-accent); background: var(--cp-surface-soft); border-radius: 0 .625rem .625rem 0; padding: 12px 16px; margin: 12px 0; }
.analogy .lab, .cfo .lab { font-weight: 700; font-size: 0.875rem; color: var(--cp-accent); display: block; margin-bottom: 2px; }
.cfo { border: 1px solid var(--cp-border-strong); border-radius: 16px; padding: 14px 18px; background: var(--cp-bg-elevated); margin: 18px 0; }
.cfo .lab { color: var(--cp-text); }
.cfo .lab::before { content: "CFO"; display: inline-block; margin-right: 8px; padding: 0 6px; border-radius: 6px; background: var(--cp-text); color: var(--cp-surface); font-size: 0.75rem; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile {
  border: 1px solid var(--cp-border); border-radius: 16px; padding: 14px 16px; background: var(--cp-surface);
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
}
.tile.click { cursor: pointer; transition: border-color .15s, transform .15s; }
.tile.click:hover { border-color: var(--cp-accent); transform: translateY(-1px); }
.tile .t { font-weight: 700; }
.tile .s { font-size: 0.875rem; color: var(--cp-text-muted); }
.pill {
  display: inline-block; font-size: 0.8125rem; font-weight: 700; padding: 1px 9px; border-radius: 99px;
  border: 1px solid var(--cp-border); color: var(--cp-text-muted); background: var(--cp-surface-soft);
}
.pill.acc { border-color: var(--cp-accent); color: var(--cp-accent); background: var(--cp-accent-soft); }
.pill.ok { border-color: var(--cp-success); color: var(--cp-success); }
.pill.warn { border-color: var(--cp-warning); color: var(--cp-warning); }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--cp-accent); cursor: pointer;
  background: var(--cp-accent); color: var(--cp-accent-fg); border-radius: .625rem; padding: 7px 16px; font-weight: 600; font-size: 0.9375rem;
}
.btn:hover { background: var(--cp-accent-hover); border-color: var(--cp-accent-hover); }
.btn.ghost { background: transparent; color: var(--cp-accent); }
.btn.ghost:hover { background: var(--cp-accent-soft); }
.btn:disabled { opacity: .45; cursor: default; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.seg { display: inline-flex; border: 1px solid var(--cp-border); border-radius: .625rem; overflow: hidden; }
.seg button { border: 0; background: var(--cp-surface); padding: 7px 14px; cursor: pointer; font-size: 0.9375rem; }
.seg button + button { border-left: 1px solid var(--cp-border); }
.seg button.on { background: var(--cp-accent); color: var(--cp-accent-fg); font-weight: 700; }
table.fs { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
table.fs th, table.fs td { padding: 5px 10px; border-bottom: 1px solid var(--cp-border); }
table.fs th { text-align: center; font-size: 0.84375rem; color: var(--cp-text-muted); font-weight: 700; background: var(--cp-surface-soft); }
table.fs td.n, table.fs th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.fs tr.tot td { font-weight: 700; background: var(--cp-surface-soft); }
table.fs tr.sec td { font-weight: 700; color: var(--cp-accent); background: transparent; border-bottom: 2px solid var(--cp-accent); padding-top: 12px; }
table.fs td.adj { color: var(--cp-accent); }
table.fs td.res { font-weight: 700; }
table.fs td.flash { background: var(--cp-highlight); transition: background .3s; }
table.fs tr.struck td { text-decoration: line-through; color: var(--cp-text-soft); }
.neg { color: var(--cp-danger); }
.pos { color: var(--cp-success); }
.muted { color: var(--cp-text-muted); }
.small { font-size: 0.875rem; }
.tbl-wrap { overflow-x: auto; }
.ctrl { display: grid; grid-template-columns: 210px 1fr 110px; gap: 12px; align-items: center; margin: 8px 0; }
.ctrl label { font-weight: 600; font-size: 0.9375rem; }
.ctrl output { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--cp-accent); }
input[type=range] { width: 100%; accent-color: var(--cp-accent); }
.hbar { display: flex; height: 34px; border-radius: .625rem; overflow: hidden; border: 1px solid var(--cp-border); background: var(--cp-surface-soft); }
.hbar > div { display: flex; align-items: center; justify-content: center; font-size: 0.8125rem; font-weight: 700; white-space: nowrap; overflow: hidden; transition: width .35s; color: var(--cp-surface); }
.c-gray { background: var(--cp-text-soft); }
.c-acc { background: var(--cp-accent); }
.c-warn { background: var(--cp-warning); color: var(--cp-text) !important; }
.c-ok { background: var(--cp-success); }
.c-link { background: var(--cp-link); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.84375rem; color: var(--cp-text-muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.barlab { font-size: 0.875rem; font-weight: 700; margin: 10px 0 4px; display: flex; justify-content: space-between; }
.journal { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
.journal td { padding: 5px 10px; border-bottom: 1px dashed var(--cp-border); }
.journal td.acct { background: var(--cp-accent-soft); font-weight: 600; }
.journal th { font-size: 0.8125rem; color: var(--cp-text-muted); text-align: left; padding: 4px 10px; border-bottom: 1px solid var(--cp-border); }
.journal td.n { text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--cp-border); border-radius: 99px; padding: 5px 14px; cursor: pointer; background: var(--cp-surface); font-size: 0.9375rem;
}
.chip.sel { border-color: var(--cp-accent); background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 700; }
.chip.right { border-color: var(--cp-success); color: var(--cp-success); }
.chip.wrong { border-color: var(--cp-danger); color: var(--cp-danger); }
.quiz { border: 1px solid var(--cp-border); border-radius: 16px; padding: 14px 18px; margin: 18px 0; background: var(--cp-bg-elevated); }
.quiz .q { font-weight: 700; margin-bottom: 8px; }
.quiz .q::before { content: "確認問題"; display: inline-block; margin-right: 8px; font-size: 0.75rem; padding: 0 7px; border-radius: 6px; background: var(--cp-accent); color: var(--cp-accent-fg); vertical-align: 2px; }
.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: .625rem; padding: 8px 12px; cursor: pointer; font-size: 0.9375rem;
}
.opt:hover { border-color: var(--cp-accent); }
.opt.right { border-color: var(--cp-success); background: var(--cp-surface-soft); }
.opt.right::after { content: "　○ 正解"; color: var(--cp-success); font-weight: 700; }
.opt.wrong { border-color: var(--cp-danger); }
.opt.wrong::after { content: "　× ちがいます"; color: var(--cp-danger); font-weight: 700; }
.fb { margin-top: 8px; font-size: 0.9375rem; color: var(--cp-text-muted); display: none; }
.fb.show { display: block; }
.next-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--cp-border); flex-wrap: wrap; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.flow .st { flex: 1 1 150px; border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: .625rem; padding: 10px 12px; font-size: 0.875rem; }
.flow .st b { display: block; color: var(--cp-accent); font-size: 0.9375rem; }
.flow .arr { align-self: center; color: var(--cp-text-soft); font-weight: 700; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { border: 1px solid var(--cp-border); border-radius: 16px; padding: 12px 14px; background: var(--cp-surface); }
.kpi .l { font-size: 0.8125rem; color: var(--cp-text-muted); }
.kpi .v { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 0.8125rem; }
.switches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.sw {
  display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--cp-border); border-radius: .625rem; padding: 8px 10px; cursor: pointer; background: var(--cp-surface); font-size: 0.875rem; line-height: 1.4;
}
.sw input { accent-color: var(--cp-accent); margin-top: 3px; }
.sw.on { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
.sw b { display: block; font-size: 0.90625rem; }
.cbars .row { display: grid; grid-template-columns: 150px 1fr 96px; gap: 10px; align-items: center; margin: 4px 0; font-size: 0.875rem; }
.cbars .track { position: relative; height: 18px; background: var(--cp-surface-soft); border-radius: 6px; overflow: hidden; }
.cbars .fill { position: absolute; top: 0; bottom: 0; border-radius: 6px; transition: all .35s; }
.cbars .mid { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--cp-border-strong); left: 50%; }
.cbars .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.region { margin: 12px 0 4px; font-weight: 700; color: var(--cp-text-muted); font-size: 0.875rem; }
.cc { display: flex; gap: 10px; align-items: flex-start; }
.code {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
  font-weight: 800; font-size: 0.84375rem; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); color: var(--cp-text);
}
.tile.sel { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
.tl { position: relative; margin-left: 10px; padding-left: 20px; border-left: 2px solid var(--cp-border); }
.tl .it { position: relative; margin: 0 0 12px; }
.tl .it::before { content: ""; position: absolute; left: -27px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--cp-accent); }
.tl .d { font-weight: 700; color: var(--cp-accent); font-size: 0.875rem; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-surface); }
.bigscore { font-size: 2.75rem; font-weight: 800; color: var(--cp-accent); font-variant-numeric: tabular-nums; }
.check-ok { color: var(--cp-success); font-weight: 700; }
.check-ng { color: var(--cp-danger); font-weight: 700; }
.wf .row { display: grid; grid-template-columns: 260px 1fr 90px; gap: 10px; align-items: center; margin: 5px 0; font-size: 0.90625rem; }
.wf .track { position: relative; height: 22px; }
.wf .blk { position: absolute; top: 0; bottom: 0; border-radius: 4px; transition: all .35s; }
.note { font-size: 0.84375rem; color: var(--cp-text-muted); }
.hide { display: none !important; }
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  nav.side { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid var(--cp-border); }
  nav.side .grp { display: none; }
  nav.side button { width: auto; }
  .grid2, .grid3, .grid4, .kpis, .switches { grid-template-columns: 1fr; }
  .ctrl { grid-template-columns: 1fr; }
  main { padding: 18px 16px 80px; }
  .prog { min-width: 140px; }
}

.cfo.md .lab::before { content: "MBA"; }
.sb-svg { width: 100%; height: auto; display: block; overflow: visible; max-width: 900px; margin-left: auto; margin-right: auto; }
.cb-axis { stroke: var(--cp-border); stroke-width: 1; }
.cb-axis.zero { stroke: var(--cp-text-soft); stroke-width: 1.5; }
.cb-txt { fill: var(--cp-text-muted); font-size: 11.5px; }
.sb-val { fill: var(--cp-text); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sb-act, .sb-tot, .sb-navy { fill: var(--cp-link); }
.sb-sky { fill: color-mix(in srgb, var(--cp-link) 45%, var(--cp-surface)); }
.sb-acc { fill: var(--cp-accent); }
.sb-peach { fill: color-mix(in srgb, var(--cp-accent) 45%, var(--cp-surface)); }
.sb-ok, .sb-up, .sb-prof { fill: var(--cp-success); }
.sb-dn { fill: var(--cp-danger); }
.sb-gray { fill: var(--cp-border-strong); }
.sb-gold { fill: var(--cp-warning); }
.sb-line { fill: none; stroke: var(--cp-link); stroke-width: 3; }
.sb-line2 { fill: none; stroke: var(--cp-accent); stroke-width: 3; }
.sb-line3 { fill: none; stroke: var(--cp-success); stroke-width: 3; }
.sb-dline { fill: none; stroke: var(--cp-text-soft); stroke-width: 2; stroke-dasharray: 6 4; }
.sb-dot { fill: var(--cp-link); stroke: var(--cp-surface); stroke-width: 1.5; }
.sb-tgt { stroke: var(--cp-warning); stroke-width: 2; stroke-dasharray: 6 4; }
.sb-conn { stroke: var(--cp-border-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.c-navy { background: var(--cp-link); }
.c-sky { background: color-mix(in srgb, var(--cp-link) 45%, var(--cp-surface)); }
.c-peach { background: color-mix(in srgb, var(--cp-accent) 45%, var(--cp-surface)); }
.c-cash { background: var(--cp-link); }
.c-prof { background: var(--cp-success); }
.c-warn { background: var(--cp-warning); }
.c-ng { background: var(--cp-danger); }
.sb-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 8px 0; }
.sb-kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.sb-kpis.k2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sb-kpi { border: 1px solid var(--cp-border); border-radius: 16px; padding: 10px 14px; background: var(--cp-surface); }
.sb-kpi .l { font-size: 0.8125rem; font-weight: 700; color: var(--cp-text-muted); }
.sb-kpi .v { font-size: 1.5rem; font-weight: 800; line-height: 1.35; font-variant-numeric: tabular-nums lining-nums; }
.sb-kpi .v.good { color: var(--cp-success); }
.sb-kpi .v.bad { color: var(--cp-danger); }
.sb-kpi .v.warn { color: var(--cp-warning); }
.sb-kpi .d { font-size: 0.8125rem; color: var(--cp-text-muted); line-height: 1.6; }
.sb-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

<body>
<header class="top">
  <div class="logo" aria-hidden="true">S</div>
  <div class="brand">スモールビジネス経営アプリ<small>小さく始めて、強く育てる ── 経営・営業・マーケ・オペレーション・お金・法律・顧客対応</small></div>
  <button class="iconbtn navbtn" id="navBtn" type="button" aria-controls="nav" aria-expanded="false">☰ 目次</button>
  <span class="hbreak" aria-hidden="true"></span>
  <div class="prog" title="完了したレッスンの数">
    <div class="bar"><i id="progbar"></i></div>
    <span id="progtxt">0 / 0 完了</span>
  </div>
  <div class="fsz" role="group" aria-label="文字の大きさ"><span class="lab">文字サイズ</span><button type="button" data-fs="m" title="標準の文字サイズ">標準</button><button type="button" data-fs="l" title="少し大きく">大</button><button type="button" data-fs="xl" title="もっと大きく">特大</button></div>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="ライト／ダーク切り替え" title="ライト／ダーク切り替え">◐<span class="lab"> 表示切替</span></button>
</header>
<div class="layout">
  <nav class="side" id="nav" aria-label="レッスン一覧"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<script>
  (() => {
    const root = document.documentElement, hdr = document.querySelector("header.top");
    const syncHdr = () => { if (hdr) root.style.setProperty("--hdr-h", hdr.offsetHeight + "px"); };
    const mark = () => {
      const cur = root.getAttribute("data-fs") || "m";
      document.querySelectorAll(".fsz button").forEach((b) => { const on = b.dataset.fs === cur; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
      syncHdr();
    };
    document.querySelectorAll(".fsz button").forEach((b) => b.addEventListener("click", () => {
      const v = b.dataset.fs;
      if (v === "m") root.removeAttribute("data-fs"); else root.setAttribute("data-fs", v);
      try { localStorage.setItem("learn-ui:fs", v); } catch (e) { /* storage unavailable */ }
      mark();
    }));
    window.addEventListener("resize", syncHdr);
    mark();
  })();
</script>
<script>
  (() => {
    const root = document.documentElement;
    // remember the light/dark choice (the button itself is wired in each app)
    try {
      new MutationObserver(() => {
        try { localStorage.setItem("learn-ui:theme", root.getAttribute("data-theme") || "light"); } catch (e) { /* storage unavailable */ }
      }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    } catch (e) { /* MutationObserver unavailable */ }
    // favicon drawn from the header logo in the theme accent color
    const logo = document.querySelector(".logo");
    if (logo) {
      const cs = getComputedStyle(root);
      const acc = cs.getPropertyValue("--cp-accent").trim(), fg = cs.getPropertyValue("--cp-accent-fg").trim();
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${acc}"/><text x="32" y="44" font-size="34" font-weight="700" text-anchor="middle" fill="${fg}" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">${logo.textContent.trim()}</text></svg>`;
      let icon = document.querySelector('link[rel="icon"]');
      if (!icon) { icon = document.createElement("link"); icon.rel = "icon"; document.head.appendChild(icon); }
      icon.href = "data:image/svg+xml," + encodeURIComponent(svg);
    }
    // phones / tablets: the lesson list opens as a drawer from the header
    const navBtn = document.getElementById("navBtn");
    const setNav = (open) => {
      document.body.classList.toggle("nav-open", open);
      if (navBtn) navBtn.setAttribute("aria-expanded", open ? "true" : "false");
    };
    if (navBtn) navBtn.addEventListener("click", (e) => { e.stopPropagation(); setNav(!document.body.classList.contains("nav-open")); });
    document.addEventListener("click", (e) => {
      if (!document.body.classList.contains("nav-open")) return;
      if (e.target.closest("#nav [data-go]") || !e.target.closest("#nav")) setNav(false);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setNav(false); });
    // back-to-top button for long lessons
    const up = document.createElement("button");
    up.type = "button"; up.className = "totop"; up.textContent = "▲"; up.title = "ページの先頭へ"; up.setAttribute("aria-label", "ページの先頭へ");
    up.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    document.body.appendChild(up);
    window.addEventListener("scroll", () => up.classList.toggle("show", window.scrollY > 900), { passive: true });
    // deep links: #lesson-id in the address bar (bookmarks, sharing, browser back/forward)
    const baseTitle = document.title;
    window.LearnShell = {
      hashId() { try { return decodeURIComponent(window.location.hash.slice(1)); } catch (e) { return ""; } },
      sync(id, title) {
        document.title = title && id !== "welcome" ? `${title}｜${baseTitle}` : baseTitle;
        try {
          const h = "#" + encodeURIComponent(id);
          if (!window.location.hash) history.replaceState(null, "", h);
          else if (window.location.hash !== h) history.pushState(null, "", h);
        } catch (e) { /* history API unavailable (sandboxed preview) */ }
      },
      start(lessons, fallback) { const h = this.hashId(); return lessons.some((l) => l.id === h) ? h : fallback; },
      xlRef(root, name) {
        const h1 = root.querySelector("h1");
        if (!h1 || !name) return;
        const p = document.createElement("p");
        p.className = "xlref";
        p.innerHTML = `<span aria-hidden="true">📗</span> 実践ツール（Excel）で使うシート：「<b>${name}</b>」`;
        h1.insertAdjacentElement("afterend", p);
      },
    };
    const onHash = () => {
      const h = window.LearnShell.hashId();
      if (!h || typeof go !== "function" || typeof LESSONS === "undefined") return;
      if (LESSONS.some((l) => l.id === h) && h !== current) go(h);
    };
    window.addEventListener("popstate", onHash);
    window.addEventListener("hashchange", onHash);
    // shared quiz runner: one question at a time, score, review of missed questions, retry only the missed ones
    window.LearnQuiz = (box, all, cfg = {}) => {
      const AB = "ABCD";
      let qs = all, i = 0, score = 0, answered = false, wrong = [], retry = false;
      const title = (id) => (typeof LESSONS !== "undefined" && (LESSONS.find((l) => l.id === id) || {}).title) || "";
      const review = (q) => (q.lesson && title(q.lesson) ? `<a href="#" data-go="${q.lesson}">→「${title(q.lesson)}」を復習</a>` : "");
      const run = (list, isRetry) => { qs = list; i = 0; score = 0; wrong = []; retry = isRetry; show(); };
      const result = () => {
        const n = qs.length;
        let best = null;
        if (!retry && cfg.store && cfg.key) { best = Math.max(cfg.store.get(cfg.key, 0), score); cfg.store.set(cfg.key, best); }
        const msg = retry ? (score === n ? "全問クリア！ 苦手だった問題も、もう大丈夫です。" : "あと少し。解説とレッスンをもう一度読んでから、再チャレンジしよう。") : (cfg.msg ? cfg.msg(score, n) : "");
        const rev = wrong.map(({ q, j }) => `<div class="qrev"><div class="qq">${q.no ? `Q${q.no}　` : ""}${q.q}</div>
          <div class="qa ng">あなたの答え：${AB[j]}．${q.opts[j]}</div><div class="qa ok">正解：${AB[q.ans]}．${q.opts[q.ans]}</div>
          <div class="qe">${q.exp}${review(q) ? "　" + review(q) : ""}</div></div>`).join("");
        box.innerHTML = `<div style="text-align:center"><div class="kicker">${retry ? "RETRY RESULT" : "RESULT"}</div><div class="bigscore">${score} / ${n}</div>

 "混雑時の席の案内が不親切だった。", "ご来店いただきありがとうございました。混雑時のご案内でご不快な思いをおかけし、申し訳ございません。いただいたご意見をもとに、入口で待ち時間とお席の状況をお伝えするようにしました。またお越しいただける店づくりに努めます。", "言い訳や反論はしません。読んでいるのは、これから来るお客さまです。改善したことを具体的に書きます。"]], "b_mentor": {"mkt": "全員に好かれようとする店は、だれの「いちばん」にもなれません。ペルソナを1人決めたら、その人が毎日見る場所で、その人の言葉で話しかけてください。小さな店のマーケティングは、広告費の大きさではなく「顔が見える関係」と「約束を守り続けること」で勝てます。", "digital": "広告は「蛇口」、口コミと常連さんは「井戸」です。蛇口は開ければすぐ出ますが、止めれば終わり。最初は小さな金額で試し、獲得単価とLTVを見てから蛇口を開きましょう。そして毎月、井戸（地図の情報・口コミへの返信・紹介）を少しずつ深く掘ること。1年後に効いてくるのは井戸のほうです。", "pricing": "価格は、店の自信の表れです。値下げは誰にでもできますが、利益を取り戻すには何倍も売る必要があります。値上げをこわがらず、理由と価値をていねいに伝えてください。常連さんが離れない値上げは、あなたの店が「替えのきかない店」になった証拠です。", "cs1": "クレームは「まだ期待してくれている」というサインです。黙って去るお客さまのほうが、ずっと多いのですから。ただし、従業員を守ることも店長の仕事。正当なご意見には全力で応え、線をこえた言動には店として毅然と対応する。この2つを両立させる仕組みを、最初につくっておきましょう。", "cs2": "新しいお客さまを1人集めるのは、今のお客さまに続けてもらうより、ずっとお金がかかると言われます。解約率を1ポイント下げることは、広告費を増やすより確実に効く打ち手です。NPSは点数そのものより、低い点をつけた人の「理由」を読むためのもの。毎月、その声から1つだけ直していきましょう。"}, "c_ops_tasks": [{"name": "焙煎（計量〜記録）", "kb": "毎週", "who": "森下", "mins": 120, "hrs": 16.0, "man": "作成中", "out": "いいえ", "pr": "高", "memo": "週2回。焙煎の記録（温度・時間）を残し、一部をBさんに任せたい"}, {"name": "焼き菓子の仕込み", "kb": "毎日", "who": "森下", "mins": 45, "hrs": 18.75, "man": "なし", "out": "いいえ", "pr": "高", "memo": "分量・温度・時間を写真つきの手順書に"}, {"name": "開店準備（掃除・釣り銭）", "kb": "毎日", "who": "Aさん", "mins": 30, "hrs": 12.5, "man": "あり", "out": "いいえ", "pr": "済", "memo": "チェック表（5.）で毎日確認"}, {"name": "豆・ミルク・カップの補充", "kb": "毎日", "who": "Aさん", "mins": 10, "hrs": 4.17, "man": "なし", "out": "いいえ", "pr": "中", "memo": "置き場所と最低の量を棚に表示する"}, {"name": "レジ締め・売上の記録", "kb": "毎日", "who": "Bさん", "mins": 20, "hrs": 8.33, "man": "作成中", "out": "いいえ", "pr": "中", "memo": "レジ（POS）の日報を使って短くする"}, {"name": "閉店後の清掃・マシンの洗浄", "kb": "毎日", "who": "Bさん", "mins": 30, "hrs": 12.5, "man": "あり", "out": "いいえ", "pr": "済", "memo": ""}, {"name": "発注（生豆・牛乳・資材）", "kb": "毎週", "who": "森下", "mins": 40, "hrs": 5.33, "man": "なし", "out": "いいえ", "pr": "中", "memo": "週2回。20 在庫・発注の発注点を使ってBさんに任せる"}, {"name": "定期便・ネット注文の発送", "kb": "毎週", "who": "Cさん", "min ", "仕事を分ける・記録を残す・毎日確かめる（ここがいちばん効く）"], ["正当化", "「少しくらいなら」「みんなやっている」", "ルールを書いて決め、オーナーが守る姿を見せる"]], "bcp": [["地震・津波（店は海から約2km。ハザードマップで確認）", "店が使えない・停電・断水", "命を守る→スタッフの安否確認→店の被害を記録（写真）", "連絡網・避難の手順・地震保険（火災保険だけでは出ない）・現金1か月分"], ["台風・大雨", "臨時休業・仕入れが届かない", "前日に休業を決めてSNSで告知→仕入れを止める", "休業の判断ルール・2週間分の豆の在庫"], ["停電・設備の故障（焙煎機）", "焙煎できない・レジが使えない", "保守会社へ連絡→ほかの焙煎所に焙煎を頼む", "保守契約・焙煎を頼める先・現金のレジの手順"], ["オーナーの病気・けが", "焙煎と仕入れが止まる", "スタッフで店を回す手順に切り替える", "手順書・所得補償保険・休業補償"], ["感染症・食中毒", "営業停止・信用の低下", "保健所の指示に従う→お客さまへの連絡", "HACCPの記録・賠償責任保険"], ["ネットショップの乗っ取り・情報漏れ", "販売停止・お客さまの情報の流出", "パスワード変更・ショップ会社へ連絡→必要なら個人情報保護委員会へ報告", "2段階認証・カード情報を持たない・バックアップ"]], "order": ["命を守る（避難）", "スタッフとお客さまの安否を確かめる", "被害を記録する（写真・メモ）", "保険会社・取引先に連絡する", "再開の見通しをSNSで伝える", "ネット販売・卸だけでも再開する"], "cyber": [["メール・ネットバンキング・ネットショップ・SNSに2段階認証（MFA）を設定した", 3], ["パスワードは使い回さず、パスワード管理アプリで管理している", 3], ["レジ・パソコン・スマホは自動更新にしている", 2], ["売上・顧客・会計のデータを、2か所以上にバックアップしている（1つはつなぎっぱなしにしない）", 2], ["お客さまのカード番号を自分で保存せず、決済会社のしくみで受け取っている", 3], ["お客さま用のWi-Fiと、レジ・パソコンのネットワークを分けている", 2], ["「至急」「振込先の変更」のメールは、知っている電話番号で確かめるルールがある", 3], ["スタッフのアカウントは1人1つ。辞めた日に止める", 2]], "steps": [["① 止まると困る仕事を決める", "焙煎・店の営業・ネット販売・卸。どれを何日で再開したいか（目標の日数）"], ["② 起こりそうなことを書く", "地震・津波・台風・停電・設備の故障・オーナーの病気・感染症・情報漏れ"], ["③ 先に打つ手を決める", "連絡網・避難の手順・データのバックアップ・代わりの焙煎所・在庫・保険・手元の現金"], ["④ 年1回、練習して直す", "連絡網を回す・バックアップから戻す・保険の中身を確かめる"]], "gov": "国（中小企業庁）には、防災・減災の事前の対策をまとめた計画を認定する「事業継続力強化計画」の制度があります。認定を受けると、補助金の審査での加点や金融支援などを受けられることがあります（くわしくは中小企業庁のサイトで確認）。", "link": "メールでの詐欺・パスワード・バックアップのくわしい内容は、同じシリーズの「セキュリティ入門 ラーニングツール」で学べます。"}, "n_interview": {"rules": [["自分のアイデアを先に話さない", "話した瞬間に、相手は気をつかって「いいですね」と言う。まず相手の今の暮らしと困りごとを聞く"], ["未来ではなく、過去の行動を聞く", "「買いますか？」ではなく「最後にコーヒー豆を買ったのはいつ？どこで？いくらで？」"], ["お金と手間を、数字で聞く", "今いくら払っているか・どれくらいの頻度か・どこが面倒か"], ["1人ではなく、10人以上", "同じ答えが何人から出るか。強く言う1人の声に引っぱられない"], ["最後は、言葉より行動で確かめる", "予約・前払い・試し買い・定期便の申込み。お金や手間をかけてくれたら本物"]], "sort": [["ふだん、コーヒー豆はどこで、いくらぐらいで買っていますか？", "良い", "過去の行動とお金を聞いている"], ["焙煎したての豆の定期便があったら、使いたいですか？", "直す", "未来の「使いたい」は当てにならない。だれでも気をつかって「はい」と言いやすい"], ["最後に、豆の買い物で困ったのはどんなときでしたか？", "良い", "具体的な場面（過去）を思い出してもらっている"], ["月3,600円なら安いと思いますか？", "直す", "値段は聞き方で答えが変わる。今いくら払っているかと、試し買いで確かめる"], ["ここまでの話で、私が聞いておくべきことはありますか？", "良い", "思わぬ困りごとや、ほかの人の紹介につながる"]], "jtbd": {"template": "（どんな状況）のとき、（何をしたい）。そうすれば（どんな結果）になる", "example": "在宅で仕事をする平日の朝、コーヒーを家でおいしく入れたい。そうすれば、仕事の前に気分を切りかえられる", "note": "お客さまは「コーヒー豆」がほしいのではなく、「朝の気分を切りかえる」ために豆を“雇って”いる、と考えます（Jobs to be Done）。競合は、ほかのカフェだけでなく、コンビニのコーヒーや、散歩・音楽かもしれません。"}, "evidence": [["言葉", "「いいですね」「使いたい」", "弱い"], ["行動", "メールの登録・試飲会への参加・SNSの保存", "中くらい"], ["お金", "予約・前払い・試し買い・定期便の申込み", "強い"]]}, "n_foodTax": {"asof": "2026年11月2日", "status": "政府は「飲食料品の消費税率を2年間1%に下げる」法案を2026年10月9日に国会に出し、11月2日時点で衆議院で審議中です（まだ成立していません）。", "rows": [["期間", "2027年4月1日〜2029年3月31日の2年間（そのあと8%に戻る）"], ["対象", "今の軽減税率（8%）と同じ飲食料品：持ち帰り・テイクアウト・宅配の飲食料品、コーヒー豆、定期便の豆など"], ["10%のまま", "店内飲食（イートイン）・外食・酒類"], ["税率", "1%（国0.78%＋地方0.22%）"], ["簡易課税・2割特例・3割特例", "1%の飲食料品の売上は、売上の税額と同じ額を仕入れの税額として計算する（実質、納める税はなし）"], ["値札（総額表示）", "切りかえの前後に、古い税率の税込価格を表示できる期間がある（誤解を防ぐ表示が条件）。税抜だけの表示は不可"], ["レジ（POS）", "税率の設定の変更が必要。改修の補助（デジタル化・AI導入補助金）が予定されている（2026年11月時点で調整中）"]], "case": "こもれび珈琲は開業日（2027年4月1日）がちょうど始まりの日。1〜2年目は免税事業者なので、税率が変わっても納める消費税は増えも減りもしません。ただし、課税事業者の大手チェーンやコンビニは、持ち帰りの税込価格を約6.5%下げられます（8%→1%）。持ち帰りのブレンドの値差が広がるので、値札を下げるか、焙煎したての価値で選ばれるかを先に決めておきます。課税事業者になる2029年1〜3月は、まだ1%の期間です。", "options": [["店内と持ち帰りで同じ値札", "お客さまに分かりやすい。レジの設定が簡単", "課税事業者になると、店内の利益が減る（10%を負担）"], ["持ち帰りだけ値下げ", "大手との値差を縮められる", "利益が減る。期間が終わると値上げが必要"], ["値札は変えず、価値で勝負", "利益を守れる", "値差が広がる。試飲・説明で「高い理由」を伝え続ける必要"]], "source": "出典：衆議院「議案の経過」、国税庁「消費税率引下げ特設サイト」（令和8年9月15日開設）。成立した場合の内容です。最新は国税庁の特設サイトで確認してください。"}, "n_foodTaxShort": "【法案の動き】2026年11月2日時点で、2027年4月1日から2年間、飲食料品（軽減税率の対象）の消費税率を1%にする法案が衆議院で審議中です（まだ成立していません）。成立すれば、テイクアウトや豆の販売の税率は1%になり（店内飲食は10%のまま）、簡易課税では1%の飲食料品の売上にかかる納税は実質ゼロになります。最新は国税庁の「消費税率引下げ特設サイト」で確認してください。", "quiz": [{"q": "スモールビジネスで、黒字なのに店を閉めることになる、いちばん多い理由は？", "opts": ["売上の伸びが止まり、落ちていく", "現金（資金）が足りなくなる", "近くに大手の競合が出店する", "税金の申告が間に合わなくなる"], "ans": 1, "exp": "黒字でも、返済・在庫・掛け売り・生活費で現金がなくなれば続けられません。資金繰り表で3か月先の現金を毎月確認します。", "lesson": "intro"}, {"q": "スモールビジネスとスタートアップの考え方のちがいとして正しいのは？", "opts": ["スモールビジネスは、赤字でも急成長と上場をめざす", "スモールビジネスは、黒字で長く続けることを重視する", "スタートアップは、借入だけで小さく始めて長く続ける", "どちらも、出資を集めて急成長をめざす点は同じ"], "ans": 1, "exp": "スモールビジネスは「小さく始めて黒字で続ける」。スタートアップは投資家のお金で急成長をめざします。", "lesson": "intro"}, {"q": "開業資金のうち「運転資金」を手元に残す理由は？", "opts": ["開業前に、設備をもっと良いものに替えるため", "融資の審査で、見せ金として通帳に置くため", "1年目の税金を、開業前にまとめて前払いしておくため", "売上が安定するまでの支払いや返済にそなえるため"], "ans": 3, "exp": "開業直後は売上が少なくても、家賃・給与・返済は待ってくれません。固定費と生活費の3〜6か月分が目安です。", "lesson": "case"}, {"q": "1年目は利益が出ているのに、現金が利益ほど増えない理由として正しくないものは？", "opts": ["減価償却費", "借入の元金の返済", "生活費の引き出し", "卸の売掛金（入金が翌月）"], "ans": 0, "exp": "減価償却費は費用ですが、お金は出ていきません。元金の返済・生活費・売掛金は、利益は減らさないのに現金を減らします。", "lesson": "plan"}, {"q": "月次計画（予実管理）をつくる一番の目的は？", "opts": ["毎月の数字を、ぴったり計画どおりに当てるため", "税務署に出す書類の数字をそろえるため", "銀行に見せて、融資の金利を下げるため", "計画とずれたときにすぐ気づき、早く手を打つため"], "ans": 3, "exp": "計画は外れるものです。差に早く気づき、理由を考え、次の月の打ち手を決めるために使います。", "lesson": "plan"}, {"q": "KPIの選び方として、いちばん良いものは？", "opts": ["行動で変えられる数字を、3〜8つ選ぶ", "売上と利益の2つだけを、毎月きちんと見る", "思いつく数字を、30個以上すべて記録する", "同業の平均と同じ数字を、年に1回だけ見る"], "ans": 0, "exp": "売上を分解して、自分の行動で動かせる数字を少しだけ、毎月同じ形で見ます。", "lesson": "kpi"}, {"q": "売上＝客数×客単価×営業日数 と分解すると、何が良い？", "opts": ["計算が速くなり、帳簿をつけなくてよくなる", "税金の計算が簡単になり、節税になる", "どこがずれたか分かり、打ち手を決めやすい", "売上が自動で増え、目標が達成しやすい"], "ans": 2, "exp": "売上が足りないとき、客数・客単価・日数のどれが原因かが分かれば、やるべきことがはっきりします。", "lesson": "kpi"}, {"q": "固定費120万円/月、限界利益率60%のお店の、月の損益分岐点の売上は？", "opts": ["72万円", "120万円", "200万円", "300万円"], "ans": 2, "exp": "損益分岐点の売上＝固定費÷限界利益率＝120万÷0.6＝200万円です。", "lesson": "profit"}, {"q": "安全余裕率が30%とは、どういう意味？", "opts": ["売上があと30%下がっても、まだ赤字にはならない", "売上のうち30%が、利益として手元に残っている", "原価が、売上の30%におさまっている", "借入の30%を、もう返し終えている"], "ans": 0, "exp": "安全余裕率＝1−損益分岐点売上÷売上。売上がどれだけ下がっても赤字にならないかを表します。", "lesson": "profit"}, {"q": "限界利益率60%の商品を10%値下げしました。同じ利益を保つには、どうなる？", "opts": ["前と同じ数を売れば、利益は少しも変わらない", "前より多く売らないと利益が減る（約20%増）", "固定費が下がるので、売る数は減らせる", "値下げした分だけ、原価も自動で下がる"], "ans": 1, "exp": "売価100円なら限界利益は60円→50円。60÷50＝1.2で、前より約20%多く売らないと利益が減ります。値下げは限界利益から直接引かれるので、思ったより多く売る必要があります。", "lesson": "profit"}, {"q": "資金繰りを良くする方法として、正しくないものは？", "opts": ["掛け売りの入金を早くしてもらう", "借りられるうちに余裕を持って借りる", "在庫を必要以上に増やす", "大きな支払いを前もって確認する"], "ans": 2, "exp": "在庫はお金が形を変えたもの。売れるまで現金に戻りません。", "lesson": "cash"}, {"q": "持続化補助金などの補助金の、お金の受け取り方として正しいのは？", "opts": ["原則、申請が通るとすぐに、前払いで受け取れる", "原則、融資と同じように、利息をつけて返す", "原則、売上ではないので、税金はかからない", "原則、事業を実施して報告したあとに受け取る"], "ans": 3, "exp": "補助金は後払いが原則。それまでの支払いは自分で立て替えるので、資金繰り表に入れておきます。", "lesson": "cash"}, {"q": "元金均等返済の特徴は？", "opts": ["毎月の返済額（元金＋利息）が、最後まで同じ", "最初の数年は利息だけを払い、あとで元金をまとめて返す", "毎月の利息が同じで、元金は最後に一度に返す", "毎月の元金が同じで、最初の返済が多く、だんだん減る"], "ans": 3, "exp": "元金均等は元金が一定。利息は残高に比例するので、返済額は少しずつ減ります。毎月同じ額なのは元利均等です。", "lesson": "cash"}, {"q": "個人事業の青色申告特別控除（65万円）を受けるための条件として正しいのは？", "opts": ["簡単な帳簿で記帳し、紙で申告する", "複式簿記で記帳し、e-Taxで申告する", "複式簿記で記帳し、紙で申告する", "売上が1,000万円をこえて、記帳する"], "ans": 1, "exp": "65万円の控除は、複式簿記＋e-Tax（2026年分までは、優良な電子帳簿の保存でもよい）が条件。2027年分から：65万円＝複式簿記＋e-Tax、75万円＝さらに優良な電子帳簿などで保存。紙で申告すると65万円・75万円は使えません。", "lesson": "tax"}, {"q": "インボイスに登録した個人事業者が、2027年分・2028年分に使える消費税の特例は？", "opts": ["3割特例", "2割特例", "消費税がゼロになる", "特例はない"], "ans": 0, "exp": "2割特例は個人では2026年分まで。令和8年度の改正で、個人に限り2027・2028年分は売上の税額の3割を納める特例ができました。", "lesson": "tax"}, {"q": "スモールビジネスの成長の方法で、ふつう一番リスクが小さいのは？", "opts": ["借入をして、すぐに2店舗目と3店舗目を出す", "今のお客さまのリピートや客単価・定期便を伸ばしていく", "大きな工場を建てて、卸の量を一気に増やす", "全国向けのテレビCMを流して、知名度を一気に上げる"], "ans": 1, "exp": "既存のお客さまを深めるのが最も確実。2店舗目や買収は、仕組みと人がそろってから。", "lesson": "growth"}, {"q": "アイデアを点数で比べるとき、基準ごとに「重み」をつける理由は？", "opts": ["点数の合計を大きくして、よく見せるため", "基準の数を減らして、早く決めるため", "ほかの人の意見が入らないようにするため", "大事な基準ほど、結果に強く効かせるため"], "ans": 3, "exp": "同じ5点でも、「強みが生きる」と「初期費用が少ない」の大切さは人によって違います。重みで、自分の優先順位を結果に反映させます。", "lesson": "idea"}, {"q": "海外で成功しているビジネスを日本に持ち込むとき、最初にやるべきことは？", "opts": ["海外と同じ形・同じ価格で、すぐに大きく始める", "海外で人気なので、試さずに全国で一気に広げる", "日本の習慣・法律・価格に合わせて形を変え、小さく試す", "日本にない新しい仕組みなので、許認可は気にしなくてよい"], "ans": 2, "exp": "「なぜ売れたのか」を分解し、日本のお客さまと法律に合わせて形を変え（ローカライズ）、小さく売って確かめてから広げます。", "lesson": "idea"}, {"q": "MVP（Minimum Viable Product）の説明として正しいのは？", "opts": ["反応を確かめるための、いちばん小さく試せる商品", "細部まで作りこんだ、完成度100%の最終的な商品", "大きな広告を出すために、先につくる事業計画書", "競合の人気商品を、そのまままねて安くした商品"], "ans": 0, "exp": "MVPは「実用最小限の商品」。マルシェでのテスト販売や予約販売のように、少ないお金と時間で「本当に買ってもらえるか」を確かめます。", "lesson": "bizmodel"}, {"q": "テスト販売の前に「やめる・方向転換する基準」を決めておく、いちばんの理由は？", "opts": ["テストを早く終わらせて、すぐ本番を始めるため", "結果を見てから、都合よく解釈しないため", "目標の数字を低くして、必ず合格にするため", "お客さまに、テストのことを先に知らせるため"], "ans": 1, "exp": "人は始めたことを続けたくなるものです。数字の基準を先に決めておくと、結果を冷静に判断できます。", "lesson": "bizmodel"}, {"q": "ランチェスター戦略の「弱者の戦略」として、小さな会社に合う戦い方は？", "opts": ["広い地域で、大手と同じ商品をより安く売る", "テレビCMで、一気に全国に知名度を上げる", "商品の数をできるだけ増やし、すべてのお客さまを狙う", "狭い地域と1つの強みに集中し、お客さまに近づく"], "ans": 3, "exp": "経営資源の少ない会社は、局地戦・一点集中・接近戦で「この場所・この分野では1番」をめざします。", "lesson": "strategy"}, {"q": "法人営業のヒアリングで使うBANTの「A（Authority）」は、何を確かめる？", "opts": ["使える予算（金額の上限）は、いくらまでか", "いつまでに導入する必要があるか", "決める権限を持つ人（決裁者）はだれか", "本当に必要としている課題は何か"], "ans": 2, "exp": "B＝予算、A＝決裁者、N＝必要性、T＝時期。担当者が乗り気でも、決める人が別にいると話が止まります。", "lesson": "sales"}, {"q": "インボイスに登録していない（免税事業者の）店が、請求書をつくるときの正しい対応は？", "opts": ["登録番号の欄に、それらしい番号を入れておく", "登録番号は書かず、適格請求書と誤解されないようにする", "消費税にあたる金額は、たとえ1円でも請求してはいけない", "請求書は出さず、口頭で金額を伝えるだけにする"], "ans": 1, "exp": "登録していないのに登録番号を書くなど、適格請求書と誤解される表示は禁止されています。「消費税相当額」と書き、登録していないことが分かるようにすると安心です。", "lesson": "sales"}, {"q": "受注率（受注÷（受注＋失注））が25%の営業で、毎月3件受注したい。毎月いくつの商談を最後（受注か失注）まで進める必要がある？", "opts": ["4件", "9件", "15件", "12件"], "ans": 3, "exp": "必要な商談の数＝目標の受注数÷受注率＝3÷25%＝12件。途中で止まる案件もあるので、見込み客（リード）はさらに多く必要です。", "lesson": "pipeline"}, {"q": "4P（売る側の言葉）を、お客さまから見た言葉に言いかえたのが4Cです。4Pの「Price（価格）」にあたる4Cは？", "opts": ["Customer value（お客さまにとっての価値）", "Convenience（手に入れやすさ）", "Cost（お客さまが払うお金・時間・手間）", "Communication（対話）"], "ans": 2, "exp": "Product→価値、Price→負担（Cost）、Place→手に入れやすさ、Promotion→対話。値段だけでなく、行く手間や待ち時間もお客さまの負担です。", "lesson": "mkt"}, {"q": "ネット広告に6万円を使い、定期便の新しい会員が10人増えました。獲得単価（CAC）はいくら？", "opts": ["600円", "6,000円", "36,000円", "60,000円"], "ans": 1, "exp": "CAC＝費用÷増えたお客さまの数＝60,000÷10＝6,000円。1人が残してくれる粗利（LTV）が、これより十分に大きいかで広告の損得を判断します。", "lesson": "digital"}, {"q": "インフルエンサーに商品を無料で渡し、投稿してもらいます。2023年10月から始まったステマ規制（景品表示法）で正しい対応は？", "opts": ["「広告」「PR」など、広告だと分かる表示をしてもらう", "本人の感想なので、何も表示しなくてよい", "フォロワーが少ない人なら、表示はいらない", "責任は投稿した人だけにあるので、店は気にしなくてよい"], "ans": 0, "exp": "店が頼んだ投稿は店の広告です。広告であることを隠すと不当表示になり、責任を問われるのは頼んだ事業者（店）です。", "lesson": "digital"}, {"q": "課税事業者が、消費者向けの値札をつけるときの正しい表示は？", "opts": ["「550円（税込）」のように、総額を表示する", "「500円（税抜）」と、税抜の価格だけを表示する", "税込か税抜かは書かず、数字だけを表示する", "店内とテイクアウトは、必ず同じ税抜価格にする"], "ans": 0, "exp": "消費者に価格を示すときは、税込の総額表示が義務です。「500円（税込550円）」のように総額が分かれば、税抜価格を並べて書いてもかまいません。", "lesson": "pricing"}, {"q": "粗利率60%の商品を10%値上げします。粗利の合計を減らさないために、販売数はどこまで減ってもよい？（上限）", "opts": ["約6%", "約40%", "10%（値上げ率と同じ）", "約14%"], "ans": 3, "exp": "上限＝値上げ率÷（粗利率＋値上げ率）＝10%÷70%≒14.3%。実際の減り方がこれより小さければ、値上げで粗利は増えます。", "lesson": "pricing"}, {"q": "お客さまから強い口調でクレームの電話がありました。最初にすることとして、いちばん良いのは？", "opts": ["すぐに値引きや返金を約束して、落ち着かせる", "店の事情を先に説明して、誤解を解いておく", "最後まで聞き、不快にさせたことにお詫びする", "担当者が戻るまで、電話を保留にして待たせる"], "ans": 2, "exp": "まず受け止めます。原因が分かる前は全面的に非を認めず、「不快な思い・不便をかけたこと」へのお詫びから始め、そのあとで事実を確認します。", "lesson": "cs1"}, {"q": "2026年10月1日から、カスハラ（カスタマーハラスメント）について事業主に求められることは？", "opts": ["お客さまからのクレームは、すべて断ってよくなる", "すべての事業主が、方針・相談体制などの防止の措置をとる", "従業員が多い大きな会社だけが、対策をすればよい", "被害を受けた従業員が、1人で相手と解決しなければならない"], "ans": 1, "exp": "改正された法律で、すべての事業主にカスハラの防止措置が義務になりました（2026年10月1日施行）。正当なクレームには誠実に応えつつ、線をこえる言動から従業員を守ります（細部は厚生労働省の指針で確認）。", "lesson": "cs1"}, {"q": "NPSの調査に40人が答えました。9〜10点が14人、7〜8点が16人、0〜6点が10人です。NPSは？", "opts": ["+10", "+35", "+75", "−25"], "ans": 0, "exp": "NPS＝推奨者（9〜10点）の割合−批判者（0〜6点）の割合＝35%−25%＝+10。7〜8点（中立）は計算に入れません。", "lesson": "cs2"}, {"q": "注文・会計は1時間に60人、ドリンク作りは30杯、片づけは50人分こなせます。この店が1時間に出せるドリンクは最大いくつ？", "opts": ["約47杯（3つの平均）", "30杯", "50杯", "140杯（3つの合計）"], "ans": 1, "exp": "全体の速さは、いちばん遅い工程（ボトルネック）で決まります。ドリンク作りを強くしない限り、30杯より増えません。", "lesson": "ops"}, {"q": "生豆を1日2kg使い、注文から届くまで3日、安全在庫を2日分持ちたいとき、発注点はいくつ？", "opts": ["4kg", "6kg", "10kg", "12kg"], "ans": 2, "exp": "発注点＝1日の使用量×（届くまでの日数＋安全在庫の日数）＝2kg×（3＋2）＝10kg。在庫が10kgまで減ったら注文します。", "lesson": "inventory"}, {"q": "アルバイトが1日7時間働くとき、法律で必要な休憩は？", "opts": ["少なくとも45分を、勤務の途中に", "6時間を超えても8時間までなら不要", "少なくとも30分を、勤務の終わりに", "少なくとも60分を、勤務の途中に"], "ans": 0, "exp": "6時間を超えると45分以上、8時間を超えると1時間以上の休憩を、勤務の途中に与えます（労働基準法）。", "lesson": "inventory"}, {"q": "個人事業の開業届（開業・廃業等届出書）を税務署に出す期限の目安は？", "opts": ["開業の日から1か月以内", "開業の日の前日まで", "その年の確定申告まで", "開業の日から2か月以内"], "ans": 0, "exp": "開業届は開業の日から1か月以内です。青色申告の承認申請は原則2か月以内なので、一緒に出すと安心です。", "lesson": "legal1"}, {"q": "中古のカメラを仕入れて、ネットで売る仕事を始めます。必要になるのは？", "opts": ["食品衛生責任者の資格（保健所の講習を受ける）", "酒類販売業免許（税務署に申請する）", "特に何も要らない（ネット販売は自由）", "古物商許可（警察署を通じて公安委員会に申請）"], "ans": 3, "exp": "中古品を仕入れて売るには古物商許可が必要です。審査に40日ほどかかるので、早めに申請します。", "lesson": "legal1"}, {"q": "店舗の賃貸借契約が2029年1月31日に終わり、「解約は6か月前までに予告」とあります。やめるなら、いつまでに伝える？", "opts": ["2028年7月31日", "2028年1月31日", "2028年12月31日", "2029年1月31日"], "ans": 0, "exp": "終わりの日から6か月前の2028年7月31日までに予告が必要です。過ぎると自動更新されることがあります。台帳に「判断の期限」を書いておきます。", "lesson": "legal2"}, {"q": "従業員のいる会社が、フリーランス（従業員のいない個人）にデザインを頼むとき、フリーランス法で必要なことは？", "opts": ["口頭で頼めば十分で、支払いの期日も特に決めなくてよい", "必ず雇用契約を結び、社会保険にも加入させる", "報酬の半分を前払いし、残りは1年以内に払う", "条件を書面やメールで示し、受け取りから60日以内に払う"], "ans": 3, "exp": "2024年11月に始まったフリーランス法のルールです。条件の明示と、60日以内の支払いなどが義務になります。", "lesson": "legal2"}, {"q": "スタッフを1人雇うと、人件費が月25万円増えます。限界利益率（売上のうち、材料などの変動費を引いて残る割合）が60%なら、売上はいくら増やす必要がある？", "opts": ["15万円", "25万円", "約41.7万円", "約62.5万円"], "ans": 2, "exp": "増えた固定費÷限界利益率＝25万円÷0.6≒41.7万円。売上がこれだけ増えて、やっと人件費の分を取り戻せます。", "lesson": "people"}, {"q": "カフェで、商品や売り方の「儲け」を比べるときに使う数字として、いちばん適切なのは？", "opts": ["限界利益（売上−変動費）", "売上の大きさ", "売上の伸び率", "家賃を割り振ったあとの利益"], "ans": 0, "exp": "固定費をまかなう力は限界利益で決まります。家賃のような共通の固定費を割り振ると、黒字の商品をやめて損をする判断につながります。", "lesson": "unit"}, {"q": "メニュー分析で「人気だが薄利（よく売れるが、1つあたりの限界利益が平均より低い）」の商品に、まず考える手は？", "opts": ["すぐにメニューから外して、作る手間を減らす", "目立たない場所に移して、注文を減らす", "原価を下げるか少し値上げし、セットにして売る", "大きく値下げして、もっとたくさん売る"], "ans": 2, "exp": "よく売れる商品は、お客さまに支持されている証拠です。外すのではなく、原価・価格・セットで1つあたりの利益を上げます。", "lesson": "unit"}, {"q": "13週の資金繰り表を書くとき、正しい書き方は？", "opts": ["売上が立った日・費用が出た日で書く", "1か月の合計だけを、月末の欄に書く", "利益の見込みを、週ごとに分けて書く", "実際にお金が通帳に入る日・出る日で書く"], "ans": 3, "exp": "資金繰りは「いつ現金が動くか」。カードの売上は入金日、卸の売上は回収日、仕入れは支払日で書きます。", "lesson": "cash13"}, {"q": "こもれび珈琲の13週の資金繰りで、いちばん少ない週の現金を最も大きく増やせる手は？（記入例の条件）", "opts": ["仕入れの支払いを翌月末にする", "生活費を、毎月1万円ずつ減らす", "ネット広告を、1か月だけ止める", "営業日を、月に1日だけ増やす"], "ans": 0, "exp": "仕入れ（月35〜46万円）の支払いを1か月後ろにずらすと、いちばん少ない週の現金が約46万円増えます。支払いの条件は、運転資金を左右します。", "lesson": "cash13"}, {"q": "設備投資を判断するとき、正しい考え方は？", "opts": ["「もう払ったお金」がもったいないので続ける", "減価償却の分だけ利益が減るので、投資しない", "IRRが借入の金利より低くても、売上が増えればよい", "増える現金だけを数え、NPVと回収期間で判断する"], "ans": 3, "exp": "過去の支出（サンクコスト）は関係ありません。増える分の現金を、割引率で今の価値に直して比べます。", "lesson": "invest"}, {"q": "NPV（正味現在価値）がプラスとは、どういう意味？", "opts": ["投資した年から、黒字になることが決まっている", "回収期間が1年以内になり、借入がすぐ返せる見込み", "割引率（最低限ほしい利回り）より多く儲かる見込み", "売上が、投資した額より大きくなる見込み"], "ans": 2, "exp": "NPVは、将来の現金を割引率で今の価値に直して合計し、投資額を引いたもの。プラスなら、割引率を上回る利回りが見込めます。", "lesson": "invest"}, {"q": "90日の優先課題の書き方として、いちばん良いものは？", "opts": ["SNSをがんばって、もっとたくさん発信していく", "12月末までに、卸の取引基本契約を新しく2件結ぶ", "お店をもっと良くして、お客さまを増やす", "みんなで協力して、売上をどんどん上げる"], "ans": 1, "exp": "期限があり、終わったかどうかがはっきり分かり、担当を1人にできる形にします。", "lesson": "os"}, {"q": "週1回の経営ミーティングで、スコアカードの数字を扱うときのやり方は？", "opts": ["全部の数字について、担当者が毎回ひとつずつ詳しく説明する", "赤い数字だけ読み上げ、理由は「課題を解く」時間に話す", "数字は月に1回だけまとめて見て、週は見ない", "良い数字だけを共有して、会議の雰囲気を良くする"], "ans": 1, "exp": "報告の時間には説明しません。赤い数字は課題リストに入れ、大事な順に「見つける→話し合う→決める」で解きます。", "lesson": "os"}, {"q": "小さなお店で、現金の抜き取りなどの不正を防ぐのにいちばん効くのは？", "opts": ["信頼できる人だけを雇い、あとはお金を任せきりにする", "防犯カメラをつけて、映像は見ないで保存する", "仕事を分けて記録を残し、毎日必ず確かめる仕組みにする", "売上の目標を高くして、スタッフをがんばらせる"], "ans": 2, "exp": "不正は「動機・機会・正当化」がそろうと起きます。小さなお店ほど、1人で全部できる「機会」をなくす仕組みが効きます。", "lesson": "guard"}, {"q": "事業用の建物や設備の地震の被害について、正しいものは？", "opts": ["ふつうの火災保険で、地震の被害もすべて補償される", "火災保険だけでは出ないので、地震の補償を確かめる", "地震の被害は、国がすべて補償してくれる", "賃貸の店なら、建物も設備も何も備えなくてよい"], "ans": 1, "exp": "地震・噴火・津波による損害は、ふつうの火災保険では補償されません。特約などで備え、BCP（事業継続計画）とあわせて見直します。", "lesson": "guard"}], "gloss": [["13-week cash flow forecast", "13週の資金繰り", "これからの13週（約3か月）の入金と支払いを、週ごとに見る資金繰り表。毎週更新する。", "お金"], ["3C analysis", "3C分析", "市場・顧客（Customer）、競合（Competitor）、自社（Company）の3つの目で勝てる場所を探す方法。", "経営"], ["4C", "4C（お客さまから見た4つ）", "4Pをお客さまの目で言いかえたもの。価値・負担（Cost）・手に入れやすさ・対話（Communication）。", "マーケティング"], ["5S", "5S（整理・整頓・清掃・清潔・しつけ）", "要らない物を捨て、置き場所を決め、きれいに保ち、それを習慣にする職場づくりの基本。", "オペレーション"], ["Accounts payable", "買掛金", "仕入れたが、まだ支払っていない代金。", "お金"], ["Accounts receivable", "売掛金", "商品を渡したが、まだ入金されていない代金（掛け売り）。", "お金"], ["Act on Specified Commercial Transactions", "特定商取引法", "通信販売などのルールを決めた法律。ネットショップは事業者の名前・住所・返品の条件や、申込みの最終確認画面の表示が必要。", "リーガル"], ["Article 36 agreement", "36協定（さぶろく協定）", "法定の労働時間を超えて、または法定休日に働いてもらうために、労使で結んで労働基準監督署に届け出る協定。", "リーガル"], ["Articles of incorporation", "定款", "会社の目的・名前・場所などの基本のルールを書いたもの。株式会社は公証役場で認証を受ける。", "リーガル"], ["Automatic renewal clause", "自動更新の条項", "期間が終わるとき、どちらからも申し出がなければ同じ条件で契約が続く決まり。やめるには予告の期限までに伝える。", "リーガル"], ["Balance sheet", "貸借対照表", "ある時点の資産・負債・純資産を表す表。左右の合計が必ず一致する。", "お金"], ["Bankruptcy Prevention Mutual Aid", "経営セーフティ共済", "取引先の倒産に備える共済。掛金は必要経費（損金）にでき、倒産時に無担保で借りられる。", "お金"], ["BANT", "BANT（ヒアリングの4項目）", "予算（Budget）・決裁者（Authority）・必要性（Needs）・時期（Timeline）を確かめる型。", "営業"], ["Blue tax return", "青色申告", "帳簿をつける代わりに、特別控除などの特典がある申告の方法。", "お金"], ["Bottleneck", "ボトルネック", "いちばん処理できる量が少ない工程。そこが店や工場全体の速さの上限を決める。", "オペレーション"], ["Brand", "ブランド", "「この店なら、こうしてくれる」とお客さまが思い浮かべる約束と印象。らしさ・約束・一貫性でつくられる。", "マーケティング"], ["Break-even point", "損益分岐点", "利益がちょうどゼロになる売上。固定費÷限界利益率。", "お金"], ["Budget vs. actual", "予実管理", "計画（予算）と実績をくらべ、差の理由と打ち手を考えること。", "経営"], ["Business continuity plan (BCP)", "事業継続計画", "災害や事故のときに、大事な仕事をどう続け、いつまでに再開するかを決めた計画。", "リーガル"], ["Business email compromise (BEC)", "ビジネスメール詐欺", "取引先などになりすまし、振込先の変更などで偽の口座に振り込ませる詐欺。", "リーガル"], ["Business license / permit", "許認可", "業種によって、始める前に役所から受ける許可・届出・登録など（例：飲食店営業許可、古物商許可）。", "リーガル"], ["Business succession", "事業承継", "会社やお店を、家族・社員・第三者に引き継ぐこと。", "成長"], ["Cash conversion cycle (CCC)", "キャッシュ・コンバージョン・サイクル", "お金が出てから戻るまでの日数＝売掛の回収日数＋在庫の日数−買掛の支払日数。短いほどお金が楽。", "お金"], ["Cash flow", "キャッシュフロー（お金の流れ）", "入ってくるお金と出ていくお金。利益とはタイミングがちがう。", "お金"], ["Cash flow forecast", "資金繰り表", "毎月の入金・支払い・月末の現金を予定する表。", "お金"], ["Cash register reconciliation", "レジ締め", "1日の売上の記録と、実際の現金・キャッシュレスの額を合わせ、過不足を記録すること。", "リーガル"], ["Cash runway", "手元資金でもつ期間", "今の現金で、売上がなくても何か月支払いを続けられるか。", "お金"], ["Churn rate", "解約率", "ある期間に、会員のうちやめた人の割合（やめた人÷期首の会員）。1−解約率が継続率。", "カスタマーサポート"], ["Click-through rate (CTR)", "クリック率", "広告や投稿を見た人のうち、クリックした人の割合。", "マーケティング"], ["Closing", "クロージング", "提案の最後に、お客さまの決断を後押しして注文・契約を決めること。", "営業"], ["Consumption tax", "消費税", "売上で預かった税から、仕入れで払った税を引いて納める税金。", "お金"], ["Contribution margin", "限界利益", "売上−変動費。固定費をまかない、利益を生むもと。", "お金"], ["Conversion rate (CVR)", "購入率（コンバージョン率）", "ページを見た人や来店した人のうち、買った・申し込んだ人の割合。", "マーケティング"], ["Core values", "価値観（行動の基準）", "迷ったときに、店として何を大切にするか。採用・評価・判断の基準になる。", "経営"], ["Cost-plus pricing", "原価積み上げ方式（コストプラス）", "1個の原価にほしい利益を上乗せして価格を決める方法。原価÷目標の原価率で計算する。", "マーケティング"], ["Cross SWOT", "クロスSWOT", "SWOTの4つを掛け合わせて「攻める・かわす・補う・守る」の打ち手を考える方法。", "経営"], ["Customer acquisition cost (CAC)", "獲得単価（CAC）", "新しいお客さまを1人集めるのにかかった費用。広告費などの費用÷新規のお客さまの数。", "マーケティング"], ["Customer discovery", "顧客の発見（インタビュー）", "売る前にお客さまの話を聞き、困りごとが本当にあるかを確かめること。", "経営"], ["Customer harassment", "カスタマーハラスメント（カスハラ）", "お客さまなどの言動のうち、社会通念上許される範囲をこえ、働く人の就業環境を害するもの。2026年10月から全事業主に防止措置が義務。", "カスタマーサポート"], ["Customer journey", "カスタマージャーニー", "お客さまが店を知り、興味を持ち、買い、くり返し、人にすすめるまでの流れ。", "マーケティング"], ["Customer lifetime value (LTV)", "顧客生涯価値（LTV）", "1人のお客さまが、取引を始めてからやめるまでに残してくれる利益（粗利）の合計。", "カスタマーサポート"], ["Customer satisfaction score (CSAT)", "顧客満足度（CSAT）", "買い物や問い合わせのあとに満足度を5段階などで聞き、「満足」と答えた人の割合を見る指標。", "カスタマーサポート"], ["Dashboard", "ダッシュボード", "大事な数字を1枚にまとめた表やグラフ。", "経営"], ["Debt service coverage", "返済余力", "返済の原資（税引後の利益＋減価償却・開業費の償却−生活費）が元金の返済の何倍あるか。1年目は開業費の償却の分だけ高く出る。", "お金"], ["Debt-to-cash-flow ratio", "債務償還年数", "借入の残高を、毎年の返済の原資で何年で返せるか。金融機関がよく見る（10年以内が一つの目安）。", "お金"], ["Delegation", "権限委譲（任せること）", "仕事のやり方や決める権限を、スタッフに段階的に渡していくこと。", "成長"], ["Depreciation", "減価償却", "長く使う設備の代金を、使う年数に分けて費用にすること。お金は出ていかない。", "お金"], ["Direct fixed cost", "直接の固定費", "その商品・売り方 /* ---------- text helpers ---------- */
/* in-lesson question: the correct option is moved to a stable position chosen from the question text (so answers are spread over A-D);
   option lists that are all numbers keep their order */
const MQ_SALT = 882;
const MQ_NUM = /^[約−\-+]?\d[\d,.]*\s*(万円|円|%|倍|件|kg|杯|か月|人|日|時間)?$/;
function mqPos(q) { let h = (2166136261 ^ MQ_SALT) >>> 0; for (let i = 0; i < q.length; i++) { h ^= q.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 30; }
function mq(q, options, answer, explain) {
  if (!options.every((o) => MQ_NUM.test(String(o)))) {
    const t = mqPos(String(q)), rest = options.filter((_, i) => i !== answer);
    rest.splice(t, 0, options[answer]); options = rest; answer = t;
  }
  return `<div class="quiz" data-ans="${answer}"><div class="q">${q}</div><div class="opts">${options
    .map((o, i) => `<button class="opt" type="button" data-i="${i}">${"ABCD"[i]}．${o}</button>`).join("")}</div><div class="fb">${explain}</div></div>`;
}
function goal(t) { return `<div class="goal"><b>このレッスンのゴール：</b>${t}</div>`; }
function md(t) { return `<div class="cfo md"><span class="lab">メンター（連続起業家・MBA）のひとこと</span>${t}</div>`; }
function head(k, t, lead) { return `<div class="kicker">${k}</div><h1>${t}</h1>${lead ? `<p class="lead">${lead}</p>` : ""}`; }
function tip(t, lab = "ポイント") { return `<div class="analogy"><span class="lab">${lab}</span>${t}</div>`; }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function card(title, body) { return `<div class="card"><h2>${title}</h2>${body}</div>`; }
/* tbl(headers, rows, cls): numeric-looking cells are right-aligned automatically */
function tbl(headers, rows, cls = "") {
  const isNum = (c) => typeof c === "number" || /^[+−\-]?[\d,]+(\.\d+)?(%|円|万円|人|件|社|kg|g|袋|か月|倍|時間|本|個|日|日分|回|点|分|席|台|週|名)?$/.test(String(c).trim());
  return `<div class="tbl-wrap"><table class="fs ${cls}"><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr>${rows
    .map((r) => `<tr${r.cls ? ` class="${r.cls}"` : ""}>${r.map((c, i) => `<td class="${i === 0 ? "b" : isNum(c) ? "n" : ""}">${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function kpi(l, v, d = "", cls = "") { return `<div class="sb-kpi"><div class="l">${l}</div><div class="v ${cls}">${v}</div><div class="d">${d}</div></div>`; }

/* ---------- numbers (Excel-compatible rounding, real minus sign) ---------- */
function rnd(x, d = 0) { const m = 10 ** d, y = Number((Math.abs(x) * m).toPrecision(15)); return (Math.sign(x) * Math.round(y)) / m; }
function rdown(x, d = 0) { const m = 10 ** d, y = Number((Math.abs(x) * m).toPrecision(15)); return (Math.sign(x) * Math.floor(y)) / m; }
function rup(x, d = 0) { const m = 10 ** d, y = Number((Math.abs(x) * m).toPrecision(15)); return (Math.sign(x) * Math.ceil(y)) / m; }
function n0(x, d = 0) { const r = rnd(x, d); return (r < 0 ? "−" : "") + Math.abs(r).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }); }
function sg(x, d = 0) { const r = rnd(x, d); return (r > 0 ? "+" : "") + n0(r, d); }
function pc(x, d = 1) { return n0(x * 100, d) + "%"; }
function sgp(x, d = 1) { return sg(x * 100, d) + "%"; }
function yen(x) { return n0(x) + "円"; }
function man(x, d = 1) { return n0(x / 10000, d) + "万円"; }
const sum = (a) => a.reduce((s, x) => s + x, 0);

function bindSegH(root, id, fn) {

}

function sortQ(id, rows, opts) {
  const wide = opts.length > 2 || opts.some((o) => o.length > 14);
  const btns = wide ? `<div class="chips">${opts.map((o, i) => `<button type="button" class="chip" data-o="${i}">${esc(o)}</button>`).join("")}</div>`
    : `<div class="seg">${opts.map((o, i) => `<button type="button" data-o="${i}">${esc(o)}</button>`).join("")}</div>`;
  return `<div class="sortq ${wide ? "wide" : ""}" id="${id}">${rows.map((r, k) => `<div class="row" data-k="${k}"><div>${r}</div>${btns}<div class="ex"></div></div>`).join("")}</div><p class="small" id="${id}s" style="margin-top:10px"></p>`;
}
function bindSortQ(root, id, opts, answer, explain) {
  const first = {}, n = $$(`#${id} .row`, root).length;
  const score = () => {
    const c = Object.keys(first).length, ok = Object.values(first).filter(Boolean).length;
    $("#" + id + "s", root).innerHTML = c ? `<b>1回目で正解：${ok} / ${c} 問</b>（全${n}問）${c === n && ok === n ? '　<span class="check-ok">全問正解！</span>' : ""}` : "";
  };
  $("#" + id, root).addEventListener("click", (e) => {
    const b = e.target.closest("button[data-o]"); if (!b) return;
    const row = b.closest(".row"), k = +row.dataset.k, ans = answer(k), ok = opts[+b.dataset.o] === ans;
    $$("button", row).forEach((x) => { x.classList.remove("right", "wrong"); if (opts[+x.dataset.o] === ans) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    const ex = $(".ex", row); ex.innerHTML = `<b>${ok ? "正解！" : `正解は「${esc(ans)}」`}</b>　${explain(k)}`; ex.classList.add("show");
    if (!(k in first)) first[k] = ok;
    score();
  });
}
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); el.textContent = "コピーしました"; } catch (e) { el.textContent = "コピーできない環境です。テキストを選択してコピーしてください"; }
}

/* ---------- charts (theme colors only) ---------- */
function svgOpen(W, H, aria) { return `<svg viewBox="0 0 ${W} ${H}" class="sb-svg" role="img" aria-label="${aria || ""}">`; }
function scale(max, lo = 0, pad = 1.06) {
  const span = Math.max((max - lo) * pad, 1e-9), mag = 10 ** Math.floor(Math.log10(span));
  for (const m of [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10]) { const step = m * mag, n = Math.ceil(span / step); if (n <= 7) return { hi: lo + step * n, ticks: n }; }
  return { hi: lo + span, ticks: 4 };
}
function niceLo(min) {
  if (min >= 0) return 0;
  const mag = 10 ** Math.floor(Math.log10(-min)), step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= -min / 3) || mag;
  return -Math.ceil(-min / step) * step;

function A1_posSvg(p, mx, my, sm) {
  const PL = sm ? 40 : 64, PT = 16, PW = sm ? 300 : 470, PH = sm ? 280 : 360, W = PL + PW + 16, H = PT + PH + (sm ? 48 : 54), r = sm ? 13 : 11;
  const X = (v) => PL + (v / 6) * PW, Y = (v) => PT + PH - (v / 6) * PH;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="sb-svg a1-pos${sm ? " sm" : ""}" role="img" aria-label="ポジショニングマップ（${p.title}）">`;
  s += `<rect class="ax" x="${PL}" y="${PT}" width="${PW}" height="${PH}"/><line class="mid" x1="${X(3)}" x2="${X(3)}" y1="${PT}" y2="${PT + PH}"/><line class="mid" x1="${PL}" x2="${PL + PW}" y1="${Y(3)}" y2="${Y(3)}"/>`;
  for (let v = 1; v <= 5; v++) s += `<text class="axl" x="${X(v)}" y="${PT + PH + (sm ? 20 : 16)}" text-anchor="middle">${v}</text><text class="axl" x="${PL - 8}" y="${Y(v) + 5}" text-anchor="end">${v}</text>`;
  const by = PT + PH + 42;
  if (sm) s += `<text class="axt" x="${PL + PW / 2}" y="${by}" text-anchor="middle">${p.x} →</text><text class="axt" transform="translate(14 ${PT + PH / 2}) rotate(-90)" text-anchor="middle">${p.y} →</text>`;
  else s += `<text class="axl" x="${PL}" y="${by}">← ${p.xl[0]}</text><text class="axt" x="${PL + PW / 2}" y="${by}" text-anchor="middle">${p.x}</text><text class="axl" x="${PL + PW}" y="${by}" text-anchor="end">${p.xl[1]} →</text>`
    + `<text class="axl" transform="translate(22 ${PT + PH}) rotate(-90)">← ${p.yl[0]}</text><text class="axt" transform="translate(22 ${PT + PH / 2}) rotate(-90)" text-anchor="middle">${p.y}</text><text class="axl" transform="translate(22 ${PT}) rotate(-90)" text-anchor="end">${p.yl[1]} →</text>`;
  p.pts.forEach(([n, x, y], i) => {
    const px = X(x), py = Y(y), right = px + 16 + n.length * 13 < W;
    s += `<circle class="pt" cx="${px}" cy="${py}" r="${r}"><title>${n}（${x}, ${y}）</title></circle><text class="pl" x="${px}" y="${py + r * 0.42}" text-anchor="middle">${"ABCD"[i]}</text>`;
    if (!sm) s += `<text class="lb" x="${right ? px + 16 : px - 16}" y="${py + 4}" text-anchor="${right ? "start" : "end"}">${n}</text>`;
  });
  s += `<circle class="me" cx="${X(mx)}" cy="${Y(my)}" r="${r}"><title>自社（${mx}, ${my}）</title></circle><text class="lbm" x="${X(mx)}" y="${Y(my) - r - 7}" text-anchor="middle">自社</text>`;
  return s + "</svg>";
}

}

   sb_app_b.js — エージェント2：マーケティング（MK1〜MK3）とカスタマーサポート（C1・C2）
   データは D.b_*（sb_text2.py の APP_DATA）。数字は実践ツールの記入例（こもれび珈琲）と同じ。
   トップレベルの名前はすべて A2_。要素の id は mkt=bm* / digital=bd* / pricing=bp* / cs1=bc* / cs2=bs*
   ============================================================================ */

/* ---------- small shared parts ---------- */
function A2_chips(id, items, on) {
  return `<div class="chips" id="${id}" role="group">${items.map(([v, l]) => {
    const s = String(v) === String(on);
    return `<button type="button" class="chip${s ? " sel" : ""}" data-v="${v}" aria-pressed="${s}">${l}</button>`;
  }).join("")}</div>`;
}
function A2_bindChips(root, id, fn) {
  const el = $("#" + id, root);
  el.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    $$("button[data-v]", el).forEach((x) => { x.classList.toggle("sel", x === b); x.setAttribute("aria-pressed", String(x === b)); });
    fn(b.dataset.v);
  });
}
/* bar list with the label on its own line (readable on narrow screens). rows: [{ l, v, w: 0..1, cls }] */
function A2_bars(rows) {
  return `<div class="cbars">${rows.map((r) => `<div class="barlab"><span>${r.l}</span><span>${r.v}</span></div><div class="track"><div class="fill ${r.cls || "c-acc"}" style="left:0;width:${(Math.max(0, Math.min(1, r.w)) * 100).toFixed(1)}%"></div></div>`).join("")}</div>`;
}
/* one .hbar segment; the text is hidden when the segment is too narrow (A2_fit removes text that still overflows) */
function A2_seg(w, cls, label) {
  const p = Math.max(0, w) * 100;
  return `<div class="${cls}" style="width:${p.toFixed(1)}%" title="${esc(label)}">${p >= 9 ? label : ""}</div>`;
}
function A2_fit(box) { $$(":scope > div", box).forEach((d) => { if (d.scrollWidth > d.clientWidth + 1) d.textContent = ""; }); }
/* bar value labels that touch the dashed target line are moved to just above it */
function A2_dodge(box) {
  const ln = box && box.querySelector("line.sb-tgt"); if (!ln) return;
  const L = +ln.getAttribute("y1");
  $$("text.sb-val", box).forEach((t) => {
    const y = +t.getAttribute("y"), bb = t.getBBox(), fs = parseFloat(getComputedStyle(t).fontSize) || 12;
    const top = bb.height > 0 ? bb.y : y - fs * 0.9, bot = bb.height > 0 ? bb.y + bb.height : y + fs * 0.25;
    if (L >= top - 1 && L <= bot + 1) t.setAttribute("y", (y - (bot - L + 3)).toFixed(1));
  });
}
function A2_bindFlips(root) {
  $$(".flip", root).forEach((f) => {
    const t = () => f.setAttribute("aria-expanded", String(f.classList.toggle("open")));
    f.addEventListener("click", t);
    f.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } });
  });
}
function A2_checks(id, items) {
  return `<ul class="sb-check" id="${id}">${items.map((t, i) => `<li><label><input type="checkbox" data-i="${i}"> ${t}</label></li>`).join("")}</ul><p class="small" id="${id}n" aria-live="polite"></p>`;
}
function A2_bindChecks(root, id, doneMsg) {
  const key = "b_chk_" + id, boxes = $$(`#${id} input`, root), saved = store.get(key, []);
  boxes.forEach((b, i) => { b.checked = !!saved[i]; });
  const upd = () => {
    const v = boxes.map((b) => b.checked), n = v.filter(Boolean).length;
    store.set(key, v);
    $("#" + id + "n", root).innerHTML = `<b>${n} / ${boxes.length}</b> できています${n === boxes.length ? `　<span class="check-ok">${doneMsg}</span>` : ""}`;
  };
  $("#" + id, root).addEventListener("change", upd);
  upd();
}
/* chart axis in 万 (0 → "0"; 25,000 → "2.5万"; 2,500 → "0.25万") */
const A2_man = (v) => {
  const x = rnd(v / 10000, 4);
  return x === 0 ? "0" : n0(x, Number.isInteger(x) ? 0 : Number.isInteger(rnd(x * 10, 4)) ? 1 : 2) + "万";

function A2_Digital() {
  const R = D.b_ch_rows, T0 = D.b_ch_tot, F = D.b_funnel, S = D.b_sub;
  const gm = S.price * (1 - S.cost - S.fee) - S.ship;          // 定期便1人の1か月の粗利（15 価格設定と同じ）
  const paid = R.filter((r) => r[1] > 0 && r[2] > 0);
  const best = paid.reduce((a, b) => (b[1] / b[2] < a[1] / a[2] ? b : a));
  const most = R.reduce((a, b) => (b[2] > a[2] ? b : a));
  const ad = R.find((r) => /広告/.test(r[0]));
  const rows = R.map((r) => [r[0] + (r === best ? ' <span class="pill ok">獲得単価が最小</span>' : ""), yen(r[1]), n0(r[2]), yen(r[3]),
    r[2] ? yen(r[1] / r[2]) : "－", r[1] ? n0(r[3] / r[1], 2) + "倍" : "－"]);
  const tot = ["合計", yen(T0.cost), n0(T0.new), yen(T0.sales), yen(T0.cac), n0(T0.roas, 2) + "倍"];
  tot.cls = "tot";
  rows.push(tot);
  const fc = F.target / F.cvr, fi = fc / F.ctr, fa = fc * F.cpc;
  const st = (t, v, s) => `<div class="st"><b>${t}</b>${v}${s ? `<br><span class="small muted">${s}</span>` : ""}</div>`;
  return {
    html: `${head("MK2 マーケティング", "集客とデジタル ── お金をかける前に、数字で決める",

${card("こもれび珈琲のチャネル別の成績（2027年4〜9月の合計）", `${tbl(["チャネル", "費用", "新規客（人・社）", "初回の売上", "獲得単価（CAC）", "ROAS"], rows)}
<p class="small">いちばん多くの新規客を連れてきたのは「${most[0]}」（${n0(most[2])}人・費用${yen(most[1])}）。お金をかけたチャネルで獲得単価がいちばん低いのは「${best[0]}」（${yen(best[1] / best[2])}）です。
${ad ? `「${ad[0]}」は獲得単価${yen(ad[1] / ad[2])}・初回のROAS ${n0(ad[3] / ad[1], 2)}倍で、初回だけでは赤字。でも定期便は続けてもらえれば1人あたり約${man(gm / S.churn, 1)}の粗利（LTV）が残るので、回収できる見込みです。` : ""}</p>

          series: [{ type: "col", name: "金額", vals: [A, first, g12, nw * ltv], cls: (v, i) => ["sb-dn", "sb-sky", "sb-acc", "sb-ok"][i], label: true, labelFmt: (v) => yen(v) }],

        const verdict = ratio >= 3 ? `<b class="sb-ok">得と言える目安です。</b>獲得単価${yen(cac)}に対して、1人が生涯で${n0(ratio, 1)}倍の粗利（${yen(ltv)}）を残してくれる見込みです。少しずつ広告費を増やし、獲得単価が上がりすぎないかを毎月確かめます。`
          : ratio >= 1 ? `<b class="sb-warn">回収はできますが、余裕が小さい状態です。</b>LTV÷獲得単価は${n0(ratio, 1)}倍。購入率を上げる（申し込みページの改善・お試しセット）か、1クリックの費用を下げる（地域や言葉をしぼる）工夫をします。`
          : '<b class="sb-ng">損になる見込みです。</b>続けてもらっても、広告費を回収できません。広告を止めるか、ねらう相手と広告の内容を見直します。';
        $("#bdX", root).innerHTML = verdict + (roas < 1 ? `　初回の売上だけ見るとROASは${n0(roas, 2)}倍で赤字ですが、定期便は続けてもらうことで回収します。だから「解約率」が広告の損得を左右します。` : `　初回の売上だけで広告費を回収できています（ROAS ${n0(roas, 2)}倍）。`);
      };
      bindSliders(root, ["bdA", "bdC", "bdV", "bdK"], draw);
      draw();
      bindSortQ(root, "bdQ", ["OK", "NG"], (k) => D.b_rule_q[k][1], (k) => D.b_rule_q[k][2]);
    },
  };
}

${tbl(["解約率（1か月）", "平均の継続月数", "LTV（粗利）", "LTV÷獲得単価"], S.churns.map((c) => [pc(c, 0) + (Math.abs(c - S.churn) < 1e-9 ? ' <span class="pill acc">記入例</span>' : ""), n0(1 / c, 1) + "か月", yen(gm / c), n0(gm / c / S.cac, 1) + "倍"]))}
<p class="small muted">解約率が${pc(S.churn, 0)}から5%に下がるだけで、LTVは約${n0(S.churn / 0.05, 1)}倍。値下げより「続けてもらう工夫」が効くことが多いのは、このためです（C2 顧客満足と継続率）。ネットで定期便を売るときは、申し込みの最終確認画面に、価格・支払いの時期と方法・届く時期・契約の期間・解約の方法などの条件をはっきり表示します（特定商取引法）。</p>`)}
${N_foodTaxCard()}

${mq("コーヒー1杯の原価（豆＋カップ）が72円、目標の原価率を18%とします。原価から決める推奨価格（税抜）は？",
      ["約90円", "約360円", "約400円", "約720円"], 2,
      "推奨価格＝原価÷目標の原価率＝72÷0.18＝400円。ここから端数を切り上げ、課税事業者なら税込の総額で値札をつけます。競合の価格や、お客さまが感じる価値とも比べて決めます。")}
${mq("松竹梅（3つの価格帯）を並べる売り方について、正しいものは？",
      ["いちばん安い梅だけが売れるので意味がない", "真ん中が選ばれやすく、平均単価を上げやすい", "3つの価格は同じにして、内容だけを変える", "松は売れないので、内容はなんでもよい"], 1,
      `極端なものを避けて真ん中を選ぶ人が多いと言われます。記入例では、3つ並べると平均単価${yen(tierAvg(TI.map((t) => t[4])).p)}、梅と竹の2つだけだと${yen(base2.p)}。松も、本当に価値のある内容にします。`)}
${md(D.b_mentor.pricing)}
<p class="note">実践ツールでやってみよう：「15 価格設定」の「2. 原価の積み上げと値決め（商品は5つまで）」に、材料の仕入れ値・仕入れの量・1個に使う量、包装、作業時間、販売手数料、目標の原価率、競合の価格を入れると、推奨価格（端数処理・税込）と原価率・1個の粗利が出ます。「3. 値上げ・値下げのシミュレーション」「4. 松竹梅（3つの価格帯）で平均単価を上げる」「5. サブスク（定期便・会員）の価格とLTV」も、黄色のセルを変えるだけで計算できます。</p>`,
    mount(root) {
      /* product cost breakdown */
      const drawP = (i) => {
        const [, nm, price, ex, c1, c2, rec, rtag, tg] = PR[i], cr = c1 / ex;
        $("#bpPd", root).innerHTML = `<p class="small muted" style="margin:10px 0 6px">${nm}</p><div class="grid2"><div>${tbl(["項目", "金額・割合"], [
          ["1個の原価（材料＋包装）", n0(c1, 1) + "円"], ["目標の原価率", pc(tg, 0)], ["推奨価格（原価÷目標の原価率）", n0(rec, 1) + "円"],
          ["端数を切り上げた価格", yen(rtag)], ["実際の価格（値札）", yen(price)], ["原価率（実際）", pc(cr, 1)], ["1個の粗利（価格−原価）", n0(ex - c1, 1) + "円"]])}</div>
<div><div class="barlab"><span>価格 ${yen(price)} の中身</span></div><div class="hbar">${A2_seg(c1 / ex, "c-navy", "原価")}${A2_seg((c2 - c1) / ex, "c-gray", "手数料・送料")}${A2_seg((ex - c2) / ex, "c-ok", "残り")}</div>
${legend([["c-navy", `原価 ${n0(c1, 1)}円`], ["c-gray", `手数料・送料 ${n0(c2 - c1, 1)}円`], ["c-ok", `残り ${n0(ex - c2, 1)}円`]])}
<p class="small">${cr <= tg + 1e-9 ? `<span class="sb-ok">原価率${pc(cr, 1)}は、目標の${pc(tg, 0)}以内です。</span>` : `<span class="sb-warn">原価率${pc(cr, 1)}が、目標の${pc(tg, 0)}をこえています。価格か原価を見直す候補です。</span>`}
${c2 - c1 > c1 * 0.5 ? "送料や手数料が大きい商品は、原価だけで値決めすると利益が残りません。" : "決済の手数料（キャッシュレス）も、売れるたびにかかる費用です。"}</p></div></div>`;
        A2_fit($("#bpPd .hbar", root));
      };
      A2_bindChips(root, "bpP", (v) => drawP(+v));
      drawP(0);

      /* tax-inclusive display */
      let rate = 0.1;
      const drawX = () => {

        $("#bpXo", root).innerHTML = `<div class="sb-card best"><div class="h">税込 ${yen(inc)}<span class="small muted" style="font-weight:400">（税率${pc(rate, 0)}）</span></div>
<p class="small" style="margin:8px 0 0"><b class="sb-ok">OK</b>　「${n0(inc)}円」「${n0(inc)}円（税込）」「${n0(inc)}円（税抜${n0(x)}円）」「${n0(x)}円（税込${n0(inc)}円）」</p>
<p class="small" style="margin:6px 0 0"><b class="sb-ng">NG</b>　「${n0(x)}円（税抜）」「${n0(x)}円＋税」だけの表示</p>
<p class="small muted" style="margin:6px 0 0">1円未満の端数は、切り捨て・四捨五入など店で決めて統一します（ここでは切り捨て）。</p></div>`;
      };
      $("#bpX", root).addEventListener("input", drawX);
      bindSegH(root, "bpR", (v) => { rate = +v; drawX(); });

      let item = RA.item - 1;

        const p = PR[item][3], c2 = PR[item][5], u = sv(root, "bpU") / 100, d = sv(root, "bpD") / 100, q = sv(root, "bpQ"), w = sv(root, "bpW") / 100;
        setOut(root, "bpU", pc(u, 0)); setOut(root, "bpD", pc(d, 0)); setOut(root, "bpQ", n0(q)); setOut(root, "bpW", pc(w, 0));
        const m = (p - c2) / p, lim = u / (m + u), gp0 = (p - c2) * q, unit1 = p * (1 + u) - c2, gp1 = unit1 * q * (1 - d), diff = gp1 - gp0;
        $("#bpK", root).innerHTML = kpi("今の粗利率", pc(m, 1), `価格${yen(p)}−変動費${n0(c2, 1)}円`)
          + kpi("減ってもよい上限", pc(lim, 1), "値上げ率÷（粗利率＋値上げ率）", d <= lim ? "good" : "bad")
          + kpi("値上げ後の1か月の粗利", yen(gp1), `新しい価格 ${n0(p * (1 + u), Number.isInteger(rnd(p * (1 + u), 1)) ? 0 : 1)}円<br>今は ${yen(gp0)}`)
          + kpi("粗利の変化", sg(diff) + "円", d < lim ? "減少が上限より小さいので増える" : d > lim ? "減少が上限より大きいので減る" : "ちょうど上限", diff >= 0 ? "good" : "bad");
        const drops = [0, 5, 10, 15, 20, 25, 30];
        $("#bpG", root).innerHTML = colChart({ labels: drops.map((x) => `${x}%減`),
          series: [{ type: "col", name: "値上げ後の1か月の粗利", vals: drops.map((x) => unit1 * q * (1 - x / 100)), cls: (v) => (v >= gp0 - 1e-6 ? "sb-ok" : "sb-dn"), label: true, labelFmt: (v) => man(v, 1) }],
          target: { v: gp0, label: "" }, fmt: A2_man, h: 230, aria: "販売数の減少と、値上げ後の1か月の粗利" });
        A2_dodge($("#bpG", root));
        $("#bpGn", root).textContent = `点線は、今の1か月の粗利（${yen(gp0)}）。販売数が${pc(lim, 1)}減るまでなら、値上げ後のほうが粗利は多くなります。`;
        $("#bpY", root).innerHTML = m > w
          ? `<b>値引きの場合：</b>${pc(w, 0)}値引きすると、今と同じ粗利を保つには販売数を<b>${pc(w / (m - w), 1)}</b>増やす必要があります（1か月${n0(q)} → ${n0(q * (1 + w / (m - w)))}）。粗利率が低い商品ほど、値引きの負担は大きくなります。`
          : `<b>値引きの場合：</b>${pc(w, 0)}も値引きすると、1個あたりの粗利がなくなります。`;
      };
      A2_bindChips(root, "bpI", (v) => { item = +v; $("#bpQ", root).value = PR[item][9]; drawR(); });
      bindSliders(root, ["bpU", "bpD", "bpQ", "bpW"], drawR);
      drawR();

      /* good-better-best */
      const drawT = (src) => {
        let a = sv(root, "bpT1"), c = sv(root, "bpT3");
        if (a + c > 100) { if (src === "bpT1") c = 100 - a; else a = 100 - c; $("#bpT1", root).value = a; $("#bpT3", root).value = c; }
        const b = 100 - a - c, sh = [a / 100, b / 100, c / 100], av = tierAvg(sh);
        setOut(root, "bpT1", a + "%"); setOut(root, "bpT3", c + "%");
        $("#bpTh", root).innerHTML = A2_seg(sh[0], "c-gray", `梅 ${a}%`) + A2_seg(sh[1], "c-acc", `竹 ${b}%`) + A2_seg(sh[2], "c-navy", `松 ${c}%`);
        A2_fit($("#bpTh", root));
        $("#bpTk", root).innerHTML = kpi("平均単価", yen(av.p), `梅と竹の2つだけなら ${yen(base2.p)}`, av.p > base2.p ? "good" : "")
          + kpi("1件の平均粗利", yen(av.g), `梅と竹の2つだけなら ${yen(base2.g)}`, av.g > base2.g ? "good" : "")
          + kpi("平均の粗利率", pc(av.r, 1), "粗利÷平均単価");
      };
      const setT = (a, c) => { $("#bpT1", root).value = a; $("#bpT3", root).value = c; drawT(""); };
      bindSliders(root, ["bpT1", "bpT3"], (e) => drawT(e.target.id));
      $("#bpTa", root).addEventListener("click", () => setT(rnd(TI[0][4] * 100), rnd(TI[2][4] * 100)));
      $("#bpTb", root).addEventListener("click", () => setT(rnd(D.b_tiers2[0] * 100), rnd(D.b_tiers2[2] * 100)));
      drawT("");
    },
  };

const A3_ARR = '<span class="arr" aria-hidden="true">→</span>';
const A3_WD = ["日", "月", "火", "水", "木", "金", "土"];
const A3_LW = ["ほぼない", "たまに", "ときどき", "よくある", "ほぼ確実"];

/* 整数なら小数を出さない：74 → "74"、118.2 → "118.2" */
function A3_n(x, d = 1) { const r = rnd(x, d); return Number.isInteger(r) ? n0(r) : n0(r, d); }

/* 1つだけ選ぶチップ（aria-pressed つき） */
function A3_chips(id, items, on) {
  return `<div class="chips" id="${id}" role="group">${items.map(([v, l]) => {
    const sel = String(v) === String(on);
    return `<button type="button" class="chip${sel ? " sel" : ""}" data-v="${esc(v)}" aria-pressed="${sel}">${l}</button>`;
  }).join("")}</div>`;
}
function A3_pick(el, v) {
  $$("button[data-v]", el).forEach((b) => { const on = b.dataset.v === String(v); b.classList.toggle("sel", on); b.setAttribute("aria-pressed", String(on)); });
}
function A3_bindChips(root, id, fn) {
  const el = $("#" + id, root);
  el.addEventListener("click", (e) => { const b = e.target.closest("button[data-v]"); if (!b) return; A3_pick(el, b.dataset.v); fn(b.dataset.v); });
}
function A3_setSeg(root, id, v) { $$(`#${id} button`, root).forEach((b) => b.classList.toggle("on", b.dataset.v === String(v))); }

/* 横棒のリスト：rows = [{ l: ラベル(HTML), v: 値, w: 0〜1, cls: c-* }] */
function A3_bars(rows) {
  return `<div class="cbars">${rows.map((r) => `<div class="barlab"><span>${r.l}</span><span style="flex:none;padding-left:10px">${r.v}</span></div><div class="track"><div class="fill ${r.cls}" style="left:0;width:${(Math.max(0, Math.min(1, r.w)) * 100).toFixed(1)}%"></div></div>`).join("")}</div>`;
}
/* 100%の帯（.hbar）の1区分。14%未満は文字を出さない。はみ出す文字は A3_fit で消す */
function A3_seg(w, cls, label) { const p = Math.max(0, Math.min(1, w)) * 100; return `<div class="${cls}" style="width:${p.toFixed(2)}%">${p >= 14 ? label : ""}</div>`; }
function A3_fit(box) { if (box) $$(":scope > div", box).forEach((s) => { if (s.scrollWidth > s.clientWidth + 1) s.textContent = ""; }); }

/* チェックリスト（このブラウザに保存） */
function A3_checks(id, items) {

}
function A3_bindChecks(root, id, doneMsg) {
  const el = $("#" + id, root), key = "c_chk_" + id, saved = store.get(key, {}), boxes = $$("input", el);
  boxes.forEach((b) => { b.checked = !!(saved && typeof saved === "object" && saved[b.dataset.i]); });
  const upd = () => {
    const st = {}; let n = 0;
    boxes.forEach((b) => { if (b.checked) { st[b.dataset.i] = true; n++; } });
    store.set(key, st);
    $("#" + id + "s", root).innerHTML = `<b>${n} / ${boxes.length}</b> できています${n === boxes.length ? `　<span class="check-ok">${doneMsg}</span>` : ""}`;
  };
  el.addEventListener("change", upd); upd();
  return upd;
}

/* めくりカード（クリック・Enter・Space） */
function A3_bindFlips(el) {
  const tog = (f) => { const o = f.classList.toggle("open"); f.setAttribute("aria-expanded", String(o)); };
  el.addEventListener("click", (e) => { const f = e.target.closest(".flip"); if (f && el.contains(f)) tog(f); });
  el.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const f = e.target.closest(".flip"); if (f && el.contains(f)) { e.preventDefault(); tog(f); }
  });
}

/* 目標の点線（line.sb-tgt）に重なる値ラベルを、点線のすぐ上へ動かす */
function A3_dodge(box) {

  const d = new Date(+m[1], +m[2] - 1, +m[3]);

        $("#coUpS", root).innerHTML = nv === mn ? "これ以上は上げられません（この計算機の上限は120件）。" : `${P[k].short}を${mn}件→${nv}件にしました。いま、いちばん少ないのは<b>${b2.join("と")}</b>（${m2}件）。${tail}`;

      };

        const runs = Math.floor((h * 60) / m + 1e-9), day = runs * b, month = day * dd, ut = month ? need / month : Infinity;

      bindSliders(root, ["coR1", "coR2", "coR3", "coR4", "coR5"], () => drawR());

      $("#coCkR", root).addEventListener("click", () => { $$("#coCk input", root).forEach((b) => { b.checked = false; }); upd(); });
    },
  };
}

function A3_lgList(o) {
  const corp = o.form !== "個人事業";
  const app = { 全員: true, 個人事業: !corp, 法人: corp, 株式会社: o.form === "株式会社", 人を雇う: o.hire, 給与を払う: o.hire || corp, 店舗: o.shop, 食品: o.food, ネット販売: o.online,
    インボイス: o.invoice, "インボイス・課税事業者": o.invoice, 任意: true };
  const op = o.open, hire = o.hire ? o.hireDate || op : null;
  let fye = null;
  if (op) { const fm = corp ? o.fm : 12; fye = A3_eom(op.getFullYear(), fm); if (fye < op) fye = A3_eom(op.getFullYear() + 1, fm); }
  const due = (k) => {
    if (!k) return null;
    if (k.startsWith("hire")) { if (!hire) return null; return { hire, "hire+5": A3_addD(hire, 5), "hire+10": A3_addD(hire, 10), "hire+50": A3_addD(hire, 50), hire_next10: A3_edate(new Date(hire.getFullYear(), hire.getMonth(), 10), 1) }[k]; }
    if (k === "fye") return fye;
    if (!op) return null;
    if (k === "blue") return op <= new Date(op.getFullYear(), 0, 15) ? new Date(op.getFullYear(), 2, 15) : A3_edate(op, 2);
    if (k === "corp_blue") return A3_addD(new Date(Math.min(+A3_edate(op, 3), +fye)), -1);
    if (k === "pay") return corp || !hire ? A3_edate(op, 1) : A3_edate(hire, 1);
    if (k === "y1end") return new Date(op.getFullYear() + 1, 11, 31);
    return { open: op, "open+1m": A3_edate(op, 1), "open+2m-1": A3_addD(A3_edate(op, 2), -1), "open+5": A3_addD(op, 5), "open-7": A3_addD(op, -7), "open-30": A3_addD(op, -30) }[k] || null;
  };
  return D.c_lg_items.map(([kb, proc, key, saki, mey, kind], i) => ({ i, kb, proc, key, saki, mey, ok: !!app[key], opt: key === "任意", due: app[key] ? due(kind) : null }));
}

/* ================================================================ F1 profit structure & break-even */
function F_bepSvg(S, V, F, cur) {
  const W = 680, H = 280, L = 74, R = 16, T = 18, B = 34, iw = W - L - R, ih = H - T - B, xmax = 1.6, vr = V / S;
  const ymax = Math.max(S * xmax, F + V * xmax) * 1.05, sc = scale(ymax), hi = sc.hi, X = (x) => L + (x / xmax) * iw, Y = (v) => T + ih - (Math.min(Math.max(v, 0), hi) / hi) * ih;
  let s = svgOpen(W, H, "損益分岐点のグラフ");
  for (let k = 0; k <= sc.ticks; k++) { const v = (hi / sc.ticks) * k; s += `<line class="cb-axis${k === 0 ? " zero" : ""}" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="cb-txt" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${n0(v / 10000)}万</text>`; }
  for (let x = 0; x <= xmax + 1e-9; x += 0.2) s += `<text class="cb-txt" x="${X(x)}" y="${H - 12}" text-anchor="middle">${n0(x * 100)}%</text>`;
  s += `<path class="sb-dline" d="M${X(0)},${Y(F)} L${X(xmax)},${Y(F)}"/>`;
  s += `<path class="sb-line2" d="M${X(0)},${Y(F)} L${X(xmax)},${Y(F + V * xmax)}"/>`;
  s += `<path class="sb-line" d="M${X(0)},${Y(0)} L${X(xmax)},${Y(S * xmax)}"/>`;
  const xb = S > V ? F / (S - V) : null;
  if (xb != null && xb <= xmax) s += `<circle class="sb-dot" cx="${X(xb)}" cy="${Y(S * xb)}" r="6"><title>損益分岐点</title></circle><text class="sb-val" x="${X(xb) + 8}" y="${Y(S * xb) + 18}">損益分岐点 ${n0(xb * 100)}%</text>`;
  s += `<line class="sb-tgt" x1="${X(cur)}" x2="${X(cur)}" y1="${T}" y2="${T + ih}"/><text class="cb-txt" x="${X(cur) + 4}" y="${T + 12}">いまの数量 ${n0(cur * 100)}%</text>`;
  return s + `</svg>${legend([["c-navy", "売上"], ["c-acc", "費用の合計（固定費＋変動費）"], ["c-gray", "固定費"]])}<p class="small muted">横軸：計画の数量を100%としたときの数量。売上の線が費用の線を上回る右側が「黒字」です（単価・変動費率・固定費は上のスライダーの値）。</p>`;
}
