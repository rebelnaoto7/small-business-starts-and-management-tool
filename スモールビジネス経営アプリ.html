/* ---------- MBA additions (2026-11): F4 unit economics, F5 cash management, F6 investment, M3 operating system, L3 protecting the business
   + cards used inside existing lessons (B customer discovery, MK3/F3 food consumption-tax bill). Models mirror sb_case2.py. ---------- */
const N_ = {};
N_.saveNote = "（このブラウザに保存。OneDriveのプレビューで開いたときは保存されません。記録を残したいときは、このHTMLファイルをダウンロードしてブラウザで開いてください）";
N_.ud = (y, m, d) => new Date(Date.UTC(y, m, d));
N_.dim = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
N_.eom = (d) => N_.ud(d.getUTCFullYear(), d.getUTCMonth(), N_.dim(d.getUTCFullYear(), d.getUTCMonth()));
N_.addM = (d, k) => { const m = d.getUTCMonth() + k, y = d.getUTCFullYear() + Math.floor(m / 12), mm = ((m % 12) + 12) % 12; return N_.ud(y, mm, Math.min(d.getUTCDate(), N_.dim(y, mm))); };
N_.addD = (d, k) => new Date(d.getTime() + k * 86400000);
N_.key = (d) => d.toISOString().slice(0, 10);
N_.md = (d) => `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
N_.payday = (d, settle) => {
  if (settle === "翌営業日") return N_.addD(d, 1);
  const day = d.getUTCDate();
  if (settle === "月6回") {
    for (const [cut, pay] of [[5, 10], [10, 15], [15, 20], [20, 25], [25, null]]) if (day <= cut) return pay ? N_.ud(d.getUTCFullYear(), d.getUTCMonth(), pay) : N_.eom(d);
    return N_.addM(N_.ud(d.getUTCFullYear(), d.getUTCMonth(), 5), 1);
  }
  return day <= 15 ? N_.eom(d) : N_.addM(N_.ud(d.getUTCFullYear(), d.getUTCMonth(), 15), 1);
};
/* 開業から13週の週ごとの現金（sb_case2.week13 と同じ計算） */
N_.week13 = (o = {}) => {
  const W = D.n_w13, settle = o.settle || "月2回", ar = o.ar || "翌月末", ap = o.ap || "当月末", rate = o.rate ?? 1, weeks = 13;
  const B = SB.base(), sp = B.sp, p = B.p, ls = B.ls, [y0, m0, dd0] = W.start.split("-").map(Number), d0 = N_.ud(y0, m0 - 1, dd0);
  const flows = {}, add = (day, k, v) => { const key = N_.key(day); flows[key] = flows[key] || {}; flows[key][k] = (flows[key][k] || 0) + v; };
  const rent = sum(D.expenses.filter((e) => e[0] === "家賃").map((e) => e[2])), living = ["", "個人事業"].includes(D.case.form) ? D.case.living : 0;
  for (let m = 0; m < 4; m++) {
    const first = N_.addM(d0, m), dim = N_.dim(first.getUTCFullYear(), first.getUTCMonth()), eom = N_.eom(first);
    sp.lines.forEach((L, li) => {
      const src = D.lines[li], sales = L.sales[m] * rate;
      if (src.timing === "当月" && li <= 1) {
        const fee = src.fee / W.card;
        for (let k = 0; k < dim; k++) { const day = N_.addD(first, k); add(day, "in_cash", (sales / dim) * (1 - W.card)); add(N_.payday(day, settle), "in_card", (sales / dim) * W.card * (1 - fee)); }
      } else if (src.timing === "当月") add(eom, "in_ec", sales * (1 - src.fee));
      else add(ar === "翌月末" ? N_.eom(N_.addM(first, 1)) : eom, "in_ar", sales * (1 - src.fee));
    });
    sp.subs.forEach((S, si) => add(eom, "in_ec", S.sales[m] * rate * (1 - D.subs[si].fee)));
    add(ap === "翌月末" ? N_.eom(N_.addM(first, 1)) : eom, "out_cogs", p.cogs[m] * rate);
    add(eom, "out_var", p.ucost[m] * rate);
    add(N_.ud(first.getUTCFullYear(), first.getUTCMonth(), W.days.pay), "out_pay", p.pay[m]);
    add(eom, "out_ins", p.ins[m]);
    add(N_.ud(first.getUTCFullYear(), first.getUTCMonth(), W.days.rent), "out_rent", rent);
    add(eom, "out_exp", p.exp[m] - rent);
    add(eom, "out_loan", ls.tot[m].principal + ls.tot[m].interest);
    add(N_.ud(first.getUTCFullYear(), first.getUTCMonth(), W.days.living), "out_living", living);
  }
  const KI = ["in_cash", "in_card", "in_ec", "in_ar"], KO = ["out_cogs", "out_var", "out_pay", "out_ins", "out_rent", "out_exp", "out_loan", "out_living"];
  let cash = o.start ?? B.cf.openCash; const rows = [];
  for (let w = 0; w < weeks; w++) {
    const ws = N_.addD(d0, 7 * w), r = { start_date: ws, end_date: N_.addD(ws, 6), start: cash };
    [...KI, ...KO].forEach((k) => { r[k] = 0; for (let i = 0; i < 7; i++) { const f = flows[N_.key(N_.addD(ws, i))]; if (f && f[k]) r[k] += f[k]; } });
    r.inflow = sum(KI.map((k) => r[k])); r.outflow = sum(KO.map((k) => r[k])); cash += r.inflow - r.outflow; r.end = cash; rows.push(r);
  }
  const ends = rows.map((r) => r.end), mn = Math.min(...ends), c0 = o.start ?? B.cf.openCash;
  const balAt = (day) => { const lim = N_.key(day); let c = c0; Object.keys(flows).forEach((k) => { if (k <= lim) { const f = flows[k]; c += sum(KI.map((x) => f[x] || 0)) - sum(KO.map((x) => f[x] || 0)); } }); return c; };
  return { rows, min: mn, minWeek: ends.indexOf(mn) + 1, monthEnd: [0, 1, 2].map((m) => balAt(N_.eom(N_.addM(d0, m)))) };
};
/* メニュー分析（sb_case2.menu_analysis と同じ） */

N_.labels = (pts, box, fixed = []) => {

  const obst = pts.map((p) => ({ x1: p.x - p.r - 1, y1: p.y - p.r - 1, x2: p.x + p.r + 1, y2: p.y + p.r + 1 })), placed = [...fixed];
  const hit = (b) => b.x1 < box.x1 || b.x2 > box.x2 || b.y1 < box.y1 || b.y2 > box.y2 || placed.concat(obst).some((o) => !(b.x2 < o.x1 || b.x1 > o.x2 || b.y2 < o.y1 || b.y1 > o.y2));
  return pts.map((p) => {

/* 投資の判断（sb_case2.invest_cf と同じ） */
N_.invest = (o = {}) => {
  const P = { ...D.n_invest, ...o }, n = Math.round(P.years), dep = n ? P.inv / n : 0, rows = [], flows = [-P.inv];
  let cum = -P.inv, npv = -P.inv, payback = null;
  for (let k = 1; k <= n; k++) {
    const f = k === 1 ? P.ramp[0] : k === 2 ? P.ramp[1] : 1, s = P.sales * f, pre = s * P.cm - P.fixed, tx = (pre - dep) * P.tax, cf = pre - tx + (k === n ? P.salvage : 0), df = 1 / (1 + P.rate) ** k;
    const prev = cum; cum += cf; if (payback === null && cum >= 0) payback = k - 1 + (cf ? -prev / cf : 0);
    npv += cf * df; flows.push(cf); rows.push({ k, f, s, cm: s * P.cm, pre, dep, tx, cf, df, pv: cf * df, cum });
  }
  return { rows, npv, payback, irr: N_.irr(flows), P };
};
N_.irr = (flows) => {
  const f = (r) => sum(flows.map((c, t) => c / (1 + r) ** t));
  let lo = -0.99, hi = 10;
  if (f(lo) * f(hi) > 0) return null;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2; if (f(lo) * f(mid) <= 0) hi = mid; else lo = mid; }
  return (lo + hi) / 2;
};

  const rows = keys.map(([k, lab]) => {
    const v = [-1, 1].map((sg_) => {
      const o = { ...base };
      if (k === "ramp") o.ramp = base.ramp.map((x) => Math.min(1, x * (1 + sg_ * delta)));
      else if (k === "cost") o.cm = 1 - (1 - base.cm) * (1 - sg_ * delta);
      else if (["fixed", "inv", "rate"].includes(k)) o[k] = base[k] * (1 - sg_ * delta);
      else o[k] = base[k] * (1 + sg_ * delta);

};

  return { html: `${head("F5 お金", "現金を守る仕組み ── 13週の資金繰り・入金と支払いの条件・銀行の見方", "月次の計画は「月末の残高」しか見ません。お金が本当に足りるかは、入金の日と支払いの日で決まります。")}
    ${goal("13週の資金繰りで「お金が足りなくなる週」を前もって見つけ、入金・支払いの条件と運転資本で現金を守れる。銀行が見る数字と、社長と事業の備えを説明できる")}
    ${card("なぜ「週」で見るのか", `<p>家賃は27日、給与は25日、キャッシュレスの入金は月2回、卸の入金は翌月末……。月の合計が黒字でも、<b>支払いが先・入金があと</b>になる週は、現金が大きくへこみます。月次の計画（F2・10 資金繰り表）では、カフェの売上を「当月に入金」として計算していますが、実際のキャッシュレス決済の入金は、半月ほど遅れます。</p>${tbl(["13週の資金繰りのルール", "やり方"], D.n_w13Rules)}`)}
    <div class="card"><h2>やってみよう：開業から13週の現金（こもれび珈琲・2027年4〜6月）</h2>
      <p class="small muted">売上・費用は月次の計画（05〜10）と同じで、入金の日と支払いの日だけを実際に近づけています。条件を切りかえて、いちばん少ない週がどう変わるか見てみましょう。</p>
      <p class="small"><b>キャッシュレスの入金</b> ${segH("ncS", W.settle.map((x) => [x, x]), W.settle[0])}</p>
      <p class="small"><b>仕入れの支払い</b> ${segH("ncP", W.ap.map((x) => [x, x]), W.ap[0])}</p>
      <p class="small"><b>卸の入金</b> ${segH("ncA", W.ar.map((x) => [x, x]), W.ar[0])}</p>
      <p class="small"><b>売上の達成率</b> ${segH("ncR", [[100, "100%"], [90, "90%"], [80, "80%"]], 100)}</p>
      ${slider("ncL", "最低残高ライン（これを下回ったら手を打つ）", 500000, 2000000, 50000, W.line)}
      <div class="sb-kpis" id="ncK"></div><div id="ncC"></div>${legend([["c-cash", "その週の終わりの残高"], ["c-warn", "最低残高ライン（点線）を下回る週"]])}
      <div id="ncT"></div><p class="small" id="ncM"></p></div>
    ${card("足りなくなりそうなときの4つの手", tbl(["手", "具体的には"], D.n_w13Actions))}
    <div class="card"><h2>やってみよう：運転資本 ── 売れるほど、お金が足りなくなる？</h2>
      <p>卸のように「先に作って、あとで入金」の売り方は、伸びるほど先にお金が出ていきます。必要なお金（運転資本）＝売上×回収までの日数＋原価×（在庫の日数−支払いまでの日数）で、ざっくりつかめます。</p>
      <div class="grid2">${slider("nwS", "卸の月の売上", 100000, 2000000, 50000, 500000)}${slider("nwD", "入金までの日数（月末締め翌月末＝約45日）", 0, 90, 5, 45)}${slider("nwI", "生豆・豆の在庫の日数", 0, 90, 5, 30)}${slider("nwP", "仕入れの支払いまでの日数", 0, 60, 5, 0)}</div>
      <div class="sb-kpis" id="nwK"></div><p class="small" id="nwM"></p></div>
    ${card("銀行から見たこもれび珈琲（1年目の終わり・計画）", tbl(["数字", "こもれび珈琲", "計算", "見方"], [
      ["手元資金の月商倍率", `${n0(bk.cash_months, 1)}か月`, `現金 ${man(bk.cash)} ÷ 月の売上 ${man(bk.monthly_sales)}`, "急な売上の落ち込みに何か月耐えられるか。1か月分を切ると要注意"],
      ["借入金の月商倍率（借入金回転期間）", `${n0(bk.debt_months, 1)}か月`, `借入残高 ${man(bk.debt)} ÷ 月の売上`, `参考：${J.source}の平均は${n0(J.debt_months, 1)}か月`],
      ["債務償還年数", `${n0(bk.years, 1)}年<br><span class="small muted">2年目 ${n0(bk.years2, 1)}年</span>`, "借入残高 ÷ 返済の原資", "何年で借入を返せる力があるか。10年以内が一つの目安（国の再生計画の基準も「おおむね10倍以下」）"],
      ["返済の安全度（返済余力）", `${n0(bk.cover, 1)}倍<br><span class="small muted">2年目 ${n0(bk.cover2, 1)}倍</span>`, "返済の原資 ÷ 元金の返済", "1倍未満＝利益から返せない。1.5倍以上あると安心（12 5か年計画）"],
      ["自己資本比率（法人）", "－", "自己資本 ÷ 総資産", `個人事業は計算しにくい。参考：喫茶店の中央値${pc(J.equity_median, 1)}、黒字で資本がプラスの会社の平均${pc(J.equity_good, 1)}`]]) + `<p class="small muted">出典：中小企業庁「中小企業活性化協議会実施基本要領」別冊（債務償還年数）、${J.source}。目安は業種・地域・金融機関で変わります。</p>`)}
    ${card("融資の面談で聞かれること", tbl(["聞かれること", "答え方"], D.n_bankQs))}
    ${card("社長と事業の備え", tbl(["備え", "内容"], D.n_safety) + `<p class="small muted">${D.n_safetyNote}</p>`)}
    ${mq("13週の資金繰り表に、カードで受けた売上を書くときの正しい書き方は？", ["お客さまがカードで支払った日に書く", "決済会社から通帳に入金される日に書く", "その月の最後の日にまとめて書く", "売上の記録とは別に、書かないでおく"], 1, "資金繰りは「通帳がいつ動くか」で書きます。カードの売上は入金日、卸は回収日、仕入れは支払日。売上の日と入金の日のずれが、週ごとの現金のへこみになります。")}
    ${mq("卸の売上が伸びるとき、現金について正しいものは？（月末締め翌月末の入金・材料は当月払い）", ["売上と同じだけ、すぐに現金も増える", "伸びるほど、入金の前に払うお金が増える", "利益率が低いので、現金には関係しない", "入金の条件は、あとから変えられない"], 1, "先に材料を買い、入金はあと。伸びるほど「立て替え」が増えます。入金の早い条件の交渉や、成長に合わせた運転資金の借入を早めに考えます。")}
    ${md("私が最初の年にいちばん怖かったのは、月末ではなく、月の真ん中でした。給与と家賃を払ったあと、カードの入金までの1週間。通帳の数字が細るのを見て、13週の表を毎週月曜につけるようにしました。15分の習慣で、夜は眠れるようになります。")}
    <p class="note">実践ツールでやってみよう：「30 13週の資金繰り」に、週ごとの入金と支払いを入れると、週の終わりの残高と最低残高ラインとの差が自動で出ます（記入例は開業から13週）。下には、銀行から見た数字（月商倍率・債務償還年数など）と、社長と事業の備えのチェックがあります。</p>`,
  mount(root) {
    let settle = W.settle[0], ap = W.ap[0], ar = W.ar[0], rate = 100;
    const draw = () => {
      const line = sv(root, "ncL"), r = N_.week13({ settle, ap, ar, rate: rate / 100 }), base = N_.week13(), below = r.rows.filter((x) => x.end < line).length, B = SB.run({ rate: rate / 100 });
      setOut(root, "ncL", man(line, 0));
      $("#ncK", root).innerHTML = kpi("いちばん少ない週の残高", man(r.min), `${r.minWeek}週目（${N_.md(r.rows[r.minWeek - 1].start_date)}〜${N_.md(r.rows[r.minWeek - 1].end_date)}）の終わり`, r.min < 0 ? "bad" : r.min < line ? "warn" : "good")
        + kpi("最低残高ラインを下回る週", `${below}週`, `ライン ${man(line, 0)}`, below ? "warn" : "good")
        + kpi("記入例（月2回・当月末・翌月末）との差", `${sg((r.min - base.min) / 10000, 1)}万円`, "いちばん少ない週の残高");
      $("#ncC", root).innerHTML = colChart({ labels: r.rows.map((x) => N_.md(x.start_date)), aria: "週ごとの残高", fmt: (v) => n0(v / 10000) + "万", target: { v: line, label: "" },
        series: [{ type: "col", name: "その週の終わりの残高", vals: r.rows.map((x) => x.end), cls: (v) => (v < line ? "sb-gold" : "sb-navy") }] });
      $("#ncT", root).innerHTML = tbl(["月末", "月次の計画（10 資金繰り表）", "入金日・支払日で見た月末の残高", "差"], [0, 1, 2].map((i) => [D.months[i] + "末", man(B.cash[i]), man(r.monthEnd[i]), sg((r.monthEnd[i] - B.cash[i]) / 10000, 1) + "万円"]))
        + `<p class="small muted">差は、キャッシュレスや卸の入金が月をまたぐ分です（上の条件を切りかえると変わります）。月次の計画で黒字でも、月末の通帳はこれだけ少なく見えることがあります。</p>`;
      $("#ncM", root).innerHTML = below ? `<span class="sb-warn">△ ${below}週が最低残高ラインを下回ります。</span>入金を早める（月6回・翌営業日）、仕入れの支払いを契約どおり翌月末にする、開業時の運転資金を厚くする、のどれかで手を打ちます（6週前に気づけば、選べる手が多い）。`
        : `<span class="sb-ok">○ 13週を通して、最低残高ラインを上回ります。</span>それでも毎週月曜に更新して、先の週を確かめます。`;
    };
    bindSegH(root, "ncS", (v) => { settle = v; draw(); }); bindSegH(root, "ncP", (v) => { ap = v; draw(); }); bindSegH(root, "ncA", (v) => { ar = v; draw(); }); bindSegH(root, "ncR", (v) => { rate = +v; draw(); });
    bindSliders(root, ["ncL"], draw); draw();
    const wc = () => {
      const s = sv(root, "nwS"), d = sv(root, "nwD"), inv = sv(root, "nwI"), py = sv(root, "nwP"), cr = 1 - D.n_invest.cm;
      setOut(root, "nwS", man(s, 0)); setOut(root, "nwD", `${d}日`); setOut(root, "nwI", `${inv}日`); setOut(root, "nwP", `${py}日`);
      const need = (s * d) / 30 + (s * cr * (inv - py)) / 30, ccc = d + inv - py;
      $("#nwK", root).innerHTML = kpi("お金が戻るまでの日数（CCC）", `${n0(ccc)}日`, "回収＋在庫−支払い") + kpi("必要な運転資本", man(need), `卸の原価率 ${pc(cr, 0)} で計算`, need > 1000000 ? "warn" : "")
        + kpi("売上が2倍になると", man(need * 2), "必要なお金も2倍");
      $("#nwM", root).innerHTML = `入金を${d}日→${Math.max(d - 15, 0)}日にできれば、約${man((s * Math.min(15, d)) / 30)}の現金が浮きます。成長の前に、入金の条件・在庫の量・支払いの条件を見直しましょう。`;
    };
    bindSliders(root, ["nwS", "nwD", "nwI", "nwP"], wc); wc();
  } };
}

/* ================================================================ F6 investment decisions & scenarios */
function N_Invest() {
  const I = D.n_invest, base = { inv: I.inv, years: I.years, salvage: I.salvage, rate: I.rate, sales: I.sales, ramp: I.ramp.slice(), cm: I.cm, fixed: I.fixed, tax: I.tax };
  const scen = I.scen.map(([n, pr, s, rp]) => ({ n, pr, s, rp, r: N_.invest({ ...base, sales: s, ramp: rp }) })), exp = sum(scen.map((x) => x.pr * x.r.npv));
  const DR = D.n_drivers, dmax = Math.max(...DR.rows.map((x) => x.impact));
  return { html: `${head("F6 お金", "投資の判断とシナリオ ── 回収期間・NPV・感度分析・プレモーテム", "設備・2店舗目・人の採用。大きなお金を使う前に、「増える現金」で比べ、うまくいかない場合も先に考えます。")}
    ${goal("増える分の現金で、回収期間・NPV・IRRを出して投資を判断できる。感度分析とシナリオで「どの前提が危ないか」を見つけ、やめる基準を始める前に決められる")}
    ${card("判断の4つの約束", tbl(["約束", "内容"], D.n_invRules))}
    ${card("3つのものさし", tbl(["ものさし", "意味", "良いところ", "注意"], D.n_invYard) + `<p class="small muted">${D.n_invRateNote}</p>`)}
    <div class="card"><h2>やってみよう：${I.name}（${man(I.inv, 0)}）は、やる価値がある？</h2>
      <p class="small muted">増える卸の売上（満年度）× 限界利益率 − 増える固定費（${I.fixed_items.map((x) => `${x[0]} ${man(x[1], 0)}`).join("・")}）から、税金（減価償却で減る分も入れる）を引いた「増える現金」で計算します。1年目・2年目は立ち上がりの途中です。</p>
      <div class="grid2">${slider("niI", "投資額", 500000, 4000000, 100000, I.inv)}${slider("niS", "増える売上（満年度・年）", 1000000, 6000000, 100000, I.sales)}${slider("niC", "卸の原価率", 30, 70, 1, rnd((1 - I.cm) * 100))}${slider("niF", "増える固定費（年）", 0, 2000000, 20000, I.fixed)}${slider("niR1", "1年目の立ち上がり（満年度の何%・2年目は＋30ポイント）", 10, 100, 5, I.ramp[0] * 100)}${slider("niD", "割引率（最低限ほしい利回り）", 2, 15, 0.5, I.rate * 100)}${slider("niY", "評価する年数（耐用年数）", 3, 10, 1, I.years)}</div>
      <div class="sb-kpis k4" id="niK"></div><div id="niC2"></div>${legend([["c-navy", "その年に増える現金"], ["c-acc", "累計（投資額を引いたあと・折れ線）"]])}<div id="niT"></div><p class="small" id="niM"></p></div>
    <div class="card"><h2>感度分析（トルネード図）── どの前提がいちばん効く？</h2><p class="small muted">前提を1つずつ20%悪く／良くしたときのNPV。棒が長い前提ほど、外れたときの影響が大きいので、先に確かめます（上のスライダーの値で計算）。</p><div id="niTo"></div></div>
    ${card("シナリオ：悲観・標準・楽観", tbl(["シナリオ", "確からしさ", "増える売上（満年度）", "立ち上がり（1・2年目）", "NPV", "回収期間"], scen.map((x) => [x.n, pc(x.pr, 0), man(x.s, 0), `${pc(x.rp[0], 0)}・${pc(x.rp[1], 0)}`, `<span class="${x.r.npv < 0 ? "sb-ng" : "sb-ok"}">${man(x.r.npv)}</span>`, x.r.payback != null ? `${n0(x.r.payback, 1)}年` : "期間内に回収できない"]))
      + `<p>確からしさで重みをつけた平均（期待値）は <b>${man(exp)}</b>。平均ではプラスでも、悲観のケースでは損をします。だから「小さく始めて、数字を見て広げる」「やめる基準を先に決める」が大事です。</p>`)}
    ${card("プレモーテム ── 始める前に「失敗の理由」をさがす", `<ol>${D.n_premSteps.map((x) => `<li>${x}</li>`).join("")}</ol>` + tbl(["失敗の理由（仮定）", "早めに気づくサイン（数字）", "先に打つ手"], I.premortem) + `<p><b>やめる基準：</b>${I.kill}</p>`)}
    <div class="card"><h2>店全体の感度 ── 利益をいちばん動かすレバーは？（${DR.year}年目・それぞれ10%動かしたとき）</h2>
      ${A2_bars(DR.rows.map((x, i) => ({ l: x.label, v: `＋${man(x.impact)}`, w: x.impact / dmax, cls: i === 0 ? "c-warn" : "c-acc" })))}
      <p class="small muted">${DR.year}年目の経常利益 ${man(DR.profit)} が、それぞれ10%良くなったときに増える額。価格は数量よりも効きます（価格を上げても材料費は増えないため）。いちばん効くレバーから、手を打ち、数字を見ます。</p></div>
    ${mq("NPV（正味現在価値）がプラスになった投資について、正しいものは？", ["1年目から、必ず黒字になることが決まる", "割引率を上回る儲けが見込める", "回収期間が、かならず1年以内になる", "見込みが外れて失敗する心配は、もうない"], 1, "NPVは、将来の現金を割引率で今の価値に直して合計し、投資額を引いたもの。プラスは「見込みどおりなら、割引率より多く儲かる」という意味で、見込みが外れるリスクは感度分析とシナリオで確かめます。")}
    ${mq("「もう焙煎機の頭金に50万円払ったから、計画が悪くても続けよう」という考え方について、正しいものは？", ["払ったお金を取り戻すために、続けるのが正しい", "戻らないお金は入れず、これからの損得で決める", "50万円の分だけ、NPVに足して計算する", "やめると50万円が借金になるので、続ける"], 1, "過去に払って戻らないお金（サンクコスト）は、これからの判断に入れません。続けるか・やめるかは、これから増える現金だけで比べます。")}
    ${md("投資の会議で私が必ず聞くのは「いちばん外れそうな前提はどれ？」と「どうなったらやめる？」の2つです。この2つに答えられない計画は、どれだけNPVが大きくても、まだ準備不足です。")}
    <p class="note">実践ツールでやってみよう：「31 投資判断」に、投資額・増える売上・限界利益率・増える固定費・年数・割引率を入れると、毎年の増える現金、回収期間・NPV・IRR、前提を20%動かしたときのNPV（感度分析）、悲観・標準・楽観の期待値が自動で出ます。プレモーテムとやめる基準を書く欄もあります。</p>`,
  mount(root) {
    const draw = () => {
      const o = { ...base, inv: sv(root, "niI"), sales: sv(root, "niS"), cm: 1 - sv(root, "niC") / 100, fixed: sv(root, "niF"), rate: sv(root, "niD") / 100, years: sv(root, "niY") };
      o.ramp = [sv(root, "niR1") / 100, Math.min(1, sv(root, "niR1") / 100 + 0.3)];
      setOut(root, "niI", man(o.inv, 0)); setOut(root, "niS", man(o.sales, 0)); setOut(root, "niC", pc(1 - o.cm, 0)); setOut(root, "niF", man(o.fixed, 0)); setOut(root, "niR1", pc(o.ramp[0], 0));
      setOut(root, "niD", pc(o.rate, 1)); setOut(root, "niY", `${o.years}年`);
      const r = N_.invest(o), ok = r.npv >= 0;
      $("#niK", root).innerHTML = kpi("NPV（正味現在価値）", man(r.npv), `割引率 ${pc(o.rate, 1)}`, ok ? "good" : "bad") + kpi("IRR（内部収益率）", r.irr != null ? pc(r.irr) : "－", "割引率より高ければ合格", r.irr != null && r.irr >= o.rate ? "good" : "bad")
        + kpi("回収期間", r.payback != null ? `${n0(r.payback, 1)}年` : "期間内に回収できない", `目安：評価の年数（${o.years}年）の半分以内`, r.payback != null && r.payback <= o.years / 2 ? "good" : "warn")
        + kpi("判定", ok ? "やる価値あり" : "見直し", ok ? "前提の確からしさを感度分析で確認" : "売上・固定費・投資額を見直す", ok ? "good" : "bad");
      $("#niC2", root).innerHTML = colChart({ labels: r.rows.map((x) => `${x.k}年目`), aria: "増える現金と累計", fmt: (v) => n0(v / 10000) + "万", series: [{ type: "col", name: "その年に増える現金", vals: r.rows.map((x) => x.cf), cls: "sb-navy" }, { type: "line", name: "累計", vals: r.rows.map((x) => x.cum), cls: "sb-line2", dots: true, dotCls: "sb-acc" }] });
      $("#niT", root).innerHTML = tbl(["年", "増える売上", "限界利益", "増える固定費", "税金", "増える現金", "今の価値"], r.rows.map((x) => [`${x.k}年目`, man(x.s), man(x.cm), man(o.fixed), man(x.tx), man(x.cf), man(x.pv)]));
      $("#niM", root).innerHTML = ok ? `<span class="sb-ok">○ NPVはプラス（${man(r.npv)}）。</span>次は、下の感度分析で「外れたら困る前提」を確かめます。` : `<span class="sb-ng">× NPVがマイナス（${man(r.npv)}）。</span>この条件では、割引率に見合う儲けが出ません。増える売上を確かめるか、投資額・固定費を小さくする案を考えます。`;

    ${mq("BCP（事業継続計画）で最初に決めることは？", ["まず保険に、できるだけたくさん入っておく", "止まると困る仕事と、何日で再開したいか", "災害の後に、新しい店を探しておく", "スタッフ全員の自宅の住所を集める"], 1, "まず「何を・いつまでに」再開したいかを決め、それに合わせて連絡網・代わりの手段・在庫・保険・手元の現金をそろえます。")}

    $("#ngOr", root).addEventListener("click", reset);
  } };
}

    LearnQuiz($("#qz", root), D.quiz.map((q, k) => ({ ...q, no: k + 1 })), { store, key: "best",
      pill: (q) => { const l = LESSONS.find((x) => x.id === q.lesson); return l ? `${l.tag}` : ""; },
      msg: (score, n) => score === n ? "満点！ 開業の準備は万全です！" : score >= Math.round(n * 0.8) ? "すばらしい！ まちがえたところだけ復習しよう。" : score >= Math.round(n * 0.6) ? "いい調子！ 苦手な仕事のレッスンをもう一度。" : "あせらず、気になるレッスンから見直そう。必ずできるようになります。" });
  } };
}

function Gloss() {
  return { html: `${head("辞書", "用語集（スモールビジネスの英語と日本語）", "経営・営業・マーケティング・お金・法律の用語。英語はアメリカのスモールビジネスでよく使う言い方です。")}
    <input class="search" id="gq" type="search" placeholder="英語・日本語・意味で検索（例：CAC、損益分岐点、churn）" aria-label="用語を検索"><p class="small muted" id="gc"></p>
    <div class="chips" id="gcat" style="margin:8px 0"></div><div class="tbl-wrap" style="margin-top:8px"><table class="fs" id="gt"></table></div>`,
  mount(root) {
    const cats = ["すべて", ...Array.from(new Set(D.gloss.map((g) => g[3]).filter(Boolean)))];
    let cat = "すべて";
    $("#gcat", root).innerHTML = cats.map((c) => `<button type="button" class="chip ${c === cat ? "sel" : ""}" data-c="${c}">${c}</button>`).join("");
    const draw = () => {
      const q = $("#gq", root).value.trim().toLowerCase(), rows = D.gloss.filter((g) => (cat === "すべて" || g[3] === cat) && (!q || g.slice(0, 3).join(" ").toLowerCase().includes(q)));
      $("#gc", root).textContent = `${rows.length} / ${D.gloss.length} 語`;
      $("#gt", root).innerHTML = `<tr><th>English</th><th>日本語</th><th>意味</th><th>分野</th></tr>` + (rows.length ? rows.map((g) => `<tr><td lang="en"><b>${g[0]}</b></td><td>${g[1]}</td><td class="small">${g[2]}</td><td class="small muted">${g[3] || ""}</td></tr>`).join("") : '<tr><td colspan="4" class="muted">見つかりませんでした</td></tr>');
    };
    $("#gq", root).addEventListener("input", draw);
    $("#gcat", root).addEventListener("click", (e) => { const b = e.target.closest("[data-c]"); if (!b) return; cat = b.dataset.c; $$("#gcat .chip", root).forEach((x) => x.classList.toggle("sel", x === b)); draw(); });
    draw();
  } };
}

addLessons([
  { id: "quiz", order: 250, tag: "TEST", grp: "仕上げ", title: `確認クイズ（${D.quiz.length}問）`, desc: "理解度チェック", r: Quiz },
  { id: "gloss", order: 260, tag: "辞書", grp: "仕上げ", title: "用語集", desc: `スモールビジネスの用語${D.gloss.length}`, r: Gloss, xl: "35 用語集" },
]);

const LESSONS = LESSON_DEFS.slice().sort((a, b) => a.order - b.order);
const XL_SHEETS = Object.fromEntries(LESSONS.filter((l) => l.xl).map((l) => [l.id, l.xl]));

function renderNav() {
  let g = "", h = "";
  LESSONS.forEach((l) => {
    if (l.grp !== g) { g = l.grp; h += `<div class="grp">${g}</div>`; }
    h += `<button type="button" class="${l.id === current ? "active" : ""}"${l.id === current ? ' aria-current="page"' : ""} data-go="${l.id}"><span class="tag">${l.tag}</span><span>${l.title}</span>${done[l.id] ? '<span class="ck">✓</span>' : ""}</button>`;
  });
  nav.innerHTML = h;
  const n = LESSONS.filter((l) => done[l.id]).length;
  $("#progbar").style.width = (n / LESSONS.length) * 100 + "%";
  $("#progtxt").textContent = `${n} / ${LESSONS.length} 完了`;
}
function go(id) {
  const L = LESSONS.find((x) => x.id === id) || LESSONS[0];
  current = L.id; store.set("current", current); if (window.LearnShell) LearnShell.sync(L.id, L.title); renderNav();
  const out = L.r();
  const i = LESSONS.indexOf(L), prev = LESSONS[i - 1], next = LESSONS[i + 1];
  main.innerHTML = out.html + `<div class="next-row">
    <button class="btn ghost" type="button" ${prev ? `data-go="${prev.id}"` : "disabled"}>◀ ${prev ? prev.title : "前へ"}</button>
    <button class="btn ghost" type="button" data-toggle-done="${L.id}">${done[L.id] ? "✓ 完了済み（取り消す）" : "このレッスンを完了にする"}</button>
    ${next ? `<button class="btn" type="button" data-go="${next.id}" data-complete="${L.id}">完了して次へ：${next.title} ▶</button>` : `<button class="btn" type="button" data-complete="${L.id}" data-go="welcome">完了してトップへ</button>`}</div>`;
  if (window.LearnShell && LearnShell.xlRef && XL_SHEETS[L.id]) LearnShell.xlRef(main, XL_SHEETS[L.id]);
  if (out.mount) out.mount(main);
  window.scrollTo(0, 0);
}
document.addEventListener("click", (e) => {
  const opt = e.target.closest(".quiz .opt");
  if (opt) {
    const box = opt.closest(".quiz"), ans = +box.dataset.ans, i = +opt.dataset.i;
    $$(".opt", box).forEach((bt) => bt.classList.remove("right", "wrong"));
    opt.classList.add(i === ans ? "right" : "wrong");
    if (i !== ans) $$(".opt", box)[ans].classList.add("right");
    $(".fb", box).classList.add("show");
    return;
  }
  const td = e.target.closest("[data-toggle-done]");
  if (td) { const id = td.dataset.toggleDone; done[id] = !done[id]; store.set("done", done); renderNav(); td.textContent = done[id] ? "✓ 完了済み（取り消す）" : "このレッスンを完了にする"; return; }
  const g = e.target.closest("[data-go]");
  if (g && g.dataset.go) { e.preventDefault(); if (g.dataset.complete) { done[g.dataset.complete] = true; store.set("done", done); } go(g.dataset.go); }
});
$("#themeBtn").addEventListener("click", () => {
  const el = document.documentElement;
  el.setAttribute("data-theme", el.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
go(window.LearnShell ? LearnShell.start(LESSONS, current) : current);

</script>
<script>
/* 共有用の補助：保存できない表示（OneDrive/SharePointのプレビューなど）のときだけ働く */
(() => {
  let ok = true;
  try { const k = "learn-ui:probe"; localStorage.setItem(k, "1"); localStorage.removeItem(k); } catch (e) { ok = false; }
  if (ok) return;
  /* コピーボタン：プレビューでは新しいコピー機能（Clipboard API）が使えないが、従来のコピー命令は使える */
  const legacyCopy = text => {
    const ta = document.createElement("textarea");
    ta.value = String(text);
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    const prev = document.activeElement;
    document.body.appendChild(ta);
    ta.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    ta.remove();
    if (prev && prev.focus) { try { prev.focus({ preventScroll: true }); } catch (e) {} }
    return done;
  };
  if (navigator.clipboard) {
    const orig = navigator.clipboard.writeText ? navigator.clipboard.writeText.bind(navigator.clipboard) : null;
    try {
      Object.defineProperty(navigator.clipboard, "writeText", {
        configurable: true,
        value: t => (legacyCopy(t) ? Promise.resolve() : (orig ? orig(t) : Promise.reject(new Error("copy failed")))),
      });
    } catch (e) {}
  }
  /* OneDriveのプレビューは外部リンクを自分で処理する（確認画面のあと新しいタブで開く） */
  const hostLinks = () => typeof window.__htmlViewerInlineNavigationClick === "function";
  const st = document.createElement("style");
  st.textContent = ".share-note{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:60;width:max-content;max-width:min(520px,calc(100vw - 120px));display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:10px;border:1px solid var(--cp-warning);background:var(--cp-panel-strong);color:var(--cp-text);font-size:12.5px;line-height:1.55;box-shadow:var(--cp-shadow)}.share-note span{user-select:text}.share-note button{border:0;background:transparent;color:var(--cp-text-muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}@media (min-width:981px){.share-note{left:calc(50% + 136px)}}@media (max-width:640px){.share-note{max-width:calc(100vw - 24px);bottom:64px}}@media print{.share-note{display:none}}";
  document.head.appendChild(st);
  const note = document.createElement("div");
  note.className = "share-note";
  note.setAttribute("role", "status");
  note.innerHTML = "<span></span><button type=\"button\" aria-label=\"閉じる\">×</button>";
  const msg = note.querySelector("span");
  msg.textContent = "プレビュー表示中：学習の記録（完了したレッスン・クイズの成績など）は保存されません。記録を残したいときは、ファイルをダウンロードしてブラウザで開いてください。";
  note.querySelector("button").addEventListener("click", () => note.remove());
  const show = () => { if (!note.isConnected) document.body.appendChild(note); };
  if (document.body) show(); else document.addEventListener("DOMContentLoaded", show);
  document.addEventListener("click", e => {
    if (hostLinks()) return;
    const a = e.target.closest && e.target.closest('a[href^="http"]');
    if (!a) return;
    e.preventDefault();
    const url = a.href;
    msg.textContent = legacyCopy(url)
      ? "リンクをコピーしました。この表示では外部サイトを直接開けないため、ブラウザのアドレス欄に貼り付けて開いてください。"
      : "この表示では外部サイトを直接開けません。次のアドレスをブラウザで開いてください：" + url;
    show();
  }, true);
})();
</script>
